<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-labelledby="t d"><title id="t">Medición angular de un monitor de estudio</title><desc id="d">El micrófono se desplaza alrededor del monitor conservando un metro de distancia en ángulos de 0, 45 y 90 grados.</desc><rect width="980" height="380" rx="18" fill="#f6f8fb"/><style>text{font-family:Arial,sans-serif;fill:#233e5c}.h{font-size:26px;font-weight:bold}.s{font-size:17px}.m{font-size:14px;fill:#61728a}</style><text x="490" y="43" text-anchor="middle" class="h">¿Qué cambia al escuchar fuera del eje del monitor?</text><circle cx="286" cy="235" r="133" fill="none" stroke="#7da5ca" stroke-width="2" stroke-dasharray="7 7"/><path d="M286 235 L419 235 A133 133 0 0 0 380 141 Z" fill="#4b91bf" opacity=".15"/><rect x="258" y="202" width="56" height="68" rx="6" fill="#37485f"/><circle cx="286" cy="219" r="10" fill="#8da6bf"/><circle cx="286" cy="249" r="17" fill="#8da6bf"/><path d="M286 235 L419 235 M286 235 L380 141 M286 235 L286 102" stroke="#608eb9" stroke-width="2"/><g fill="#1c698c"><circle cx="419" cy="235" r="9"/><circle cx="380" cy="141" r="9"/><circle cx="286" cy="102" r="9"/></g><text x="441" y="241" class="s">0°</text><text x="393" y="131" class="s">45°</text><text x="300" y="95" class="s">90°</text><text x="74" y="357" class="m">Arco punteado: mismo radio de medición</text><g><rect x="560" y="93" width="354" height="222" rx="14" fill="#fff" stroke="#dae3ee"/><text x="583" y="126" class="s" font-weight="bold">Prueba con 3 bandas:</text><text x="587" y="163" class="s">• Grave: 125 Hz</text><text x="587" y="201" class="s">• Media: 1 kHz</text><text x="587" y="239" class="s">• Aguda: 4 kHz</text><text x="587" y="284" class="m">Registrar el nivel en cada ángulo</text></g><text x="490" y="373" text-anchor="middle" class="m">Comparar diferencias dentro de cada frecuencia. Mantener el nivel de reproducción y la distancia.</text></svg>