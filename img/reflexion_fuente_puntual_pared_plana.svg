<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Reflexión de una fuente puntual</title>
  <desc id="desc">Frentes de onda incidentes y reflejados frente a una pared plana, con una fuente virtual detrás de la pared.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#17324d"/></marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d95d39"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="10" stroke="#17324d" stroke-width="3"/></pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .title { fill:#17324d; font-size:34px; font-weight:760; }
      .subtitle { fill:#52687a; font-size:18px; }
      .label { fill:#17324d; font-size:21px; font-weight:650; }
      .small { fill:#52687a; font-size:16px; }
    </style>
  </defs>
  <rect width="1200" height="790" fill="#f7f9fb"/>

  <text x="600" y="54" text-anchor="middle" class="sans title">Reflexión de una fuente puntual</text>
  <text x="600" y="85" text-anchor="middle" class="sans subtitle">Los frentes reflejados parecen proceder de una fuente virtual detrás de la pared</text>
  <rect x="96" y="112" width="1008" height="535" rx="18" fill="#ffffff" stroke="#cbd5dd" stroke-width="1.5"/>
  <clipPath id="left-of-wall"><rect x="98" y="114" width="600" height="531" rx="16"/></clipPath>
  <path d="M379.47,362.75 A90.00,90.00 0 0 1 379.47,447.25" fill="none" stroke="#d95d39" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M454.52,322.84 A175.00,175.00 0 0 1 454.52,487.16" fill="none" stroke="#d95d39" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M529.57,282.94 A260.00,260.00 0 0 1 529.57,527.06" fill="none" stroke="#d95d39" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M604.62,243.03 A345.00,345.00 0 0 1 604.62,566.97" fill="none" stroke="#d95d39" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M702.67,616.26 A450.00,450.00 0 0 1 702.67,193.74" clip-path="url(#left-of-wall)" fill="none" stroke="#0f766e" stroke-width="3.2" stroke-dasharray="12 10" stroke-linecap="round"/>
  <path d="M618.79,660.86 A545.00,545.00 0 0 1 618.79,149.14" clip-path="url(#left-of-wall)" fill="none" stroke="#0f766e" stroke-width="3.2" stroke-dasharray="12 10" stroke-linecap="round"/>
  <path d="M534.91,705.46 A640.00,640.00 0 0 1 534.91,104.54" clip-path="url(#left-of-wall)" fill="none" stroke="#0f766e" stroke-width="3.2" stroke-dasharray="12 10" stroke-linecap="round"/>
  <path d="M451.03,750.06 A735.00,735.00 0 0 1 451.03,59.94" clip-path="url(#left-of-wall)" fill="none" stroke="#0f766e" stroke-width="3.2" stroke-dasharray="12 10" stroke-linecap="round"/>
  <path d="M367.15,794.66 A830.00,830.00 0 0 1 367.15,15.34" clip-path="url(#left-of-wall)" fill="none" stroke="#0f766e" stroke-width="3.2" stroke-dasharray="12 10" stroke-linecap="round"/>
  <line x1="300" y1="405" x2="700" y2="310" stroke="#d95d39" stroke-width="3.4" marker-end="url(#arrow-coral)"/>
  <line x1="700" y1="310" x2="120" y2="172" stroke="#0f766e" stroke-width="3.4" stroke-dasharray="12 9" marker-end="url(#arrow-teal)"/>
  <line x1="700" y1="310" x2="1100" y2="405" stroke="#52687a" stroke-width="2" stroke-dasharray="3 8"/>
  <line x1="300" y1="405" x2="700" y2="405" stroke="#d95d39" stroke-width="3.4" marker-end="url(#arrow-coral)"/>
  <line x1="700" y1="405" x2="120" y2="405" stroke="#0f766e" stroke-width="3.4" stroke-dasharray="12 9" marker-end="url(#arrow-teal)"/>
  <line x1="700" y1="405" x2="1100" y2="405" stroke="#52687a" stroke-width="2" stroke-dasharray="3 8"/>
  <line x1="300" y1="405" x2="700" y2="500" stroke="#d95d39" stroke-width="3.4" marker-end="url(#arrow-coral)"/>
  <line x1="700" y1="500" x2="120" y2="638" stroke="#0f766e" stroke-width="3.4" stroke-dasharray="12 9" marker-end="url(#arrow-teal)"/>
  <line x1="700" y1="500" x2="1100" y2="405" stroke="#52687a" stroke-width="2" stroke-dasharray="3 8"/>

  <rect x="700.0" y="145.0" width="18" height="470.0" fill="url(#hatch)"/>
  <line x1="700.0" y1="145.0" x2="700.0" y2="615.0" stroke="#17324d" stroke-width="5"/>
  <text x="709.0" y="649.0" text-anchor="middle" class="sans label">Pared</text>

  <circle cx="300" cy="405" r="13" fill="#17324d"/>
  <circle cx="300" cy="405" r="22" fill="none" stroke="#17324d" stroke-width="2" opacity="0.25"/>
  <text x="272" y="381" text-anchor="end" class="sans label">Fuente real</text>

  <circle cx="1100" cy="405" r="13" fill="#ffffff" stroke="#6d28d9" stroke-width="4"/>
  <circle cx="1100" cy="405" r="22" fill="none" stroke="#6d28d9" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="1076" y="377" text-anchor="end" class="sans label" fill="#6d28d9">Fuente virtual</text>

  <rect x="125" y="667" width="950" height="78" rx="14" fill="#17324d"/>
  <line x1="160" y1="692" x2="220" y2="692" stroke="#d95d39" stroke-width="4"/>
  <text x="235" y="698" class="sans" font-size="17" fill="#ffffff">Sonido incidente</text>
  <line x1="422" y1="692" x2="482" y2="692" stroke="#0f766e" stroke-width="4" stroke-dasharray="12 9"/>
  <text x="497" y="698" class="sans" font-size="17" fill="#ffffff">Sonido reflejado</text>
  <line x1="700" y1="692" x2="760" y2="692" stroke="#b7c6d0" stroke-width="3" stroke-dasharray="3 7"/>
  <text x="775" y="698" class="sans" font-size="17" fill="#ffffff">Prolongación virtual</text>
  <text x="600" y="727" text-anchor="middle" class="sans" font-size="16" fill="#c7d6df">La pared cambia la dirección de propagación; el oído interpreta la reflexión como si proviniera del punto simétrico.</text>
</svg>