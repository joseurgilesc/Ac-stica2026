  <title id="title">Reducción de seis decibelios al duplicar la distancia</title>
  <desc id="description">Gráfico con distancia relativa en escala logarítmica base dos. El nivel relativo de presión sonora disminuye aproximadamente seis decibelios por cada duplicación de distancia.</desc>
