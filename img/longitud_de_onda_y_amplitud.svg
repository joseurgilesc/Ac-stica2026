<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1120" height="560" viewBox="0 0 1120 560"
     role="img" aria-labelledby="title description">
  <title id="title">Longitud de onda y amplitud pico</title>
  <desc id="description">Diagrama vectorial de una onda sinusoidal que señala la longitud de onda entre dos crestas, la amplitud pico desde el eje de equilibrio y el avance del tiempo.</desc>

  <defs>
    <marker id="arrow-navy" markerWidth="11" markerHeight="11" refX="9" refY="5.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#173B63"/>
    </marker>
    <marker id="arrow-coral" markerWidth="11" markerHeight="11" refX="9" refY="5.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#E05B49"/>
    </marker>
    <style>
      .heading { font-family: Inter, Arial, sans-serif; font-size: 31px; font-weight: 700; fill: #173B63; }
      .label { font-family: Georgia, 'Times New Roman', serif; font-size: 25px; fill: #173B63; }
      .symbol { font-family: Georgia, 'Times New Roman', serif; font-size: 29px; font-style: italic; fill: #E05B49; }
      .note { font-family: Inter, Arial, sans-serif; font-size: 18px; fill: #4B647B; }
      .wave { fill: none; stroke: #173B63; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .axis { fill: none; stroke: #89A0B4; stroke-width: 2.2; }
      .measure { fill: none; stroke: #E05B49; stroke-width: 2.2; stroke-linecap: round; }
      .guide { fill: none; stroke: #E8A094; stroke-width: 1.6; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1120" height="560" fill="#F8FAFC"/>
  <text x="64" y="58" class="heading">Longitud de onda y amplitud pico</text>
  <line x1="64" y1="78" x2="1056" y2="78" stroke="#D9E2EA" stroke-width="2"/>

  <!-- Equilibrium axis -->
  <line x1="82" y1="280" x2="1040" y2="280" class="axis"/>
  <text x="90" y="268" class="note">Equilibrio</text>

  <!-- Sinusoidal wave: three complete cycles -->
  <path class="wave" d="M 100 280
    C 142 280, 160 160, 230 160
    C 300 160, 318 400, 388 400
    C 458 400, 476 160, 546 160
    C 616 160, 634 400, 704 400
    C 774 400, 792 160, 862 160
    C 932 160, 950 400, 1020 400"/>

  <!-- Wavelength measurement between consecutive crests -->
  <line x1="230" y1="160" x2="230" y2="112" class="guide"/>
  <line x1="546" y1="160" x2="546" y2="112" class="guide"/>
  <line x1="238" y1="112" x2="538" y2="112" class="measure"
        marker-start="url(#arrow-coral)" marker-end="url(#arrow-coral)"/>
  <text x="388" y="100" text-anchor="middle" class="label">Longitud de onda</text>
  <text x="388" y="145" text-anchor="middle" class="symbol">λ</text>

  <!-- Peak-amplitude measurement -->
  <line x1="862" y1="160" x2="998" y2="160" class="guide"/>
  <line x1="862" y1="280" x2="998" y2="280" class="guide"/>
  <line x1="978" y1="272" x2="978" y2="168" class="measure"
        marker-start="url(#arrow-coral)" marker-end="url(#arrow-coral)"/>
  <text x="995" y="208" class="label">
    <tspan x="995" dy="0">Amplitud</tspan>
    <tspan x="995" dy="29">pico</tspan>
  </text>
  <text x="946" y="228" text-anchor="end" class="symbol">A</text>

  <!-- Time direction -->
  <text x="430" y="461" class="label">Tiempo</text>
  <line x1="515" y1="453" x2="702" y2="453" stroke="#173B63" stroke-width="2.2"
        marker-end="url(#arrow-navy)"/>

  <!-- Original explanatory note -->
  <rect x="64" y="505" width="992" height="1.5" fill="#D9E2EA"/>
  <text x="64" y="535" class="note">La longitud de onda mide la separación entre puntos equivalentes de dos ciclos consecutivos.</text>
</svg>
