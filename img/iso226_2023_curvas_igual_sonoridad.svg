<text x="46" y="51" fill="#18354b" font-family="Arial,sans-serif" font-size="25" font-weight="bold">Curvas de igual sonoridad · ISO 226:2023</text>
<text x="46" y="76" fill="#5a6d7d" font-family="Arial,sans-serif" font-size="15">Un mismo contorno reúne tonos percibidos con una sonoridad comparable.</text>
