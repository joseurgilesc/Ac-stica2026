<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Curvas normalizadas de igual sonoridad ISO 226:2023 para 20, 40, 60 y 80 fones</title>
<desc id="desc">Eje horizontal de frecuencia de 20 a 12500 hercios en escala logarítmica. Eje vertical nivel de presión sonora de cero a 130 dB SPL. Contornos de igual sonoridad derivados de valores de la tabla B.1 de ISO 226:2023. Los graves requieren generalmente mayor nivel físico, sobre todo a bajas sonoridades.</desc>
