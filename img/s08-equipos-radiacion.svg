<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 395" role="img" aria-labelledby="t d"><title id="t">Equipos y formas de radiación del sonido</title><desc id="d">Monitor de estudio, columna line array y subwoofer representados mediante siluetas y frentes de onda ilustrativos.</desc><rect width="1080" height="395" rx="18" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#1a304b}.h{font-size:24px;font-weight:bold}.s{font-size:17px}.m{font-size:15px;fill:#56657a}.wave{fill:none;stroke:#549ac6;stroke-width:3;opacity:.65}</style><text x="540" y="42" text-anchor="middle" class="h">Tres equipos, tres comportamientos de radiación</text><g transform="translate(0,0)"><rect x="24" y="68" width="330" height="290" rx="16" fill="#fff" stroke="#d6e0eb"/><rect x="53" y="123" width="85" height="175" rx="12" fill="#33435a"/><circle cx="95" cy="170" r="22" fill="#758eaa"/><circle cx="95" cy="244" r="34" fill="#758eaa"/><circle cx="95" cy="244" r="17" fill="#394e68"/><path class="wave" d="M159 192 Q214 142 159 103 M175 217 Q277 141 174 75 M194 238 Q325 141 194 60"/><text x="190" y="314" text-anchor="middle" class="s">Monitor de estudio</text><text x="190" y="337" text-anchor="middle" class="m">Radiación según frecuencia</text></g><g><rect x="375" y="68" width="330" height="290" rx="16" fill="#fff" stroke="#d6e0eb"/><rect x="414" y="112" width="63" height="43" rx="6" fill="#394960"/><rect x="414" y="159" width="63" height="43" rx="6" fill="#394960"/><rect x="414" y="206" width="63" height="43" rx="6" fill="#394960"/><circle cx="445" cy="132" r="11" fill="#829bb5"/><circle cx="445" cy="180" r="11" fill="#829bb5"/><circle cx="445" cy="228" r="11" fill="#829bb5"/><path class="wave" d="M494 104 Q544 180 494 255 M522 88 Q601 180 522 270 M546 74 Q650 180 546 285"/><text x="540" y="314" text-anchor="middle" class="s">Arreglo line array</text><text x="540" y="337" text-anchor="middle" class="m">Control de cobertura</text></g><g><rect x="726" y="68" width="330" height="290" rx="16" fill="#fff" stroke="#d6e0eb"/><rect x="846" y="169" width="105" height="108" rx="12" fill="#303f55"/><circle cx="899" cy="224" r="42" fill="#7992ad"/><circle cx="899" cy="224" r="25" fill="#344b67"/><circle cx="899" cy="224" r="65" class="wave"/><circle cx="899" cy="224" r="92" class="wave"/><circle cx="899" cy="224" r="119" class="wave" stroke-dasharray="5 7"/><text x="890" y="314" text-anchor="middle" class="s">Subwoofer</text><text x="890" y="337" text-anchor="middle" class="m">Radiación grave muy amplia</text></g><text x="540" y="383" text-anchor="middle" class="m">Esquemas orientativos, no patrones polares medidos ni equivalencias exactas entre equipos y fuentes ideales.</text></svg>