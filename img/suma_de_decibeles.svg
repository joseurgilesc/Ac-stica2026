<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">Suma de dos niveles sonoros</title>
  <desc id="description">Nomograma que muestra cuánto se suma al nivel mayor cuando se combinan dos fuentes con una diferencia de nivel determinada.</desc>
  <defs>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #173B63; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 18px; fill: #587086; }
      .axis-label { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #173B63; }
      .tick { font-family: Inter, Arial, sans-serif; font-size: 15px; fill: #445B70; }
      .point { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #E05A47; }
      .note { font-family: Inter, Arial, sans-serif; font-size: 15px; fill: #587086; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#173B63"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#FFFFFF"/>

  <text x="600" y="55" class="title" text-anchor="middle">Suma de dos niveles sonoros</text>
  <text x="600" y="88" class="subtitle" text-anchor="middle">Cuánto se suma al nivel mayor al combinar dos fuentes (método gráfico)</text>

  <!-- Plot area: x 0..15 dB (difference), y 0..3 dB (add) -->
  <!-- Plot region: left=170, right=1120, top=130, bottom=560 -->
  <!-- x scale: (diff - 0) * (1120-170)/15 -->
  <!-- y scale: (add - 0) * (560-130)/3, inverted -->

  <!-- Grid lines (horizontal, every 0.5 dB) -->
  <g stroke="#D8E1E9" stroke-width="1">
    <line x1="170" y1="201.7" x2="1120" y2="201.7"/> <!-- 2.5 -->
    <line x1="170" y1="273.3" x2="1120" y2="273.3"/> <!-- 2.0 -->
    <line x1="170" y1="345" x2="1120" y2="345"/> <!-- 1.5 -->
    <line x1="170" y1="416.7" x2="1120" y2="416.7"/> <!-- 1.0 -->
    <line x1="170" y1="488.3" x2="1120" y2="488.3"/> <!-- 0.5 -->
  </g>

  <!-- Vertical grid every 1 dB -->
  <g stroke="#D8E1E9" stroke-width="1">
    <line x1="233.3" y1="130" x2="233.3" y2="560"/> <!-- 1 -->
    <line x1="296.7" y1="130" x2="296.7" y2="560"/> <!-- 2 -->
    <line x1="360" y1="130" x2="360" y2="560"/> <!-- 3 -->
    <line x1="423.3" y1="130" x2="423.3" y2="560"/> <!-- 4 -->
    <line x1="486.7" y1="130" x2="486.7" y2="560"/> <!-- 5 -->
    <line x1="550" y1="130" x2="550" y2="560"/> <!-- 6 -->
    <line x1="613.3" y1="130" x2="613.3" y2="560"/> <!-- 7 -->
    <line x1="676.7" y1="130" x2="676.7" y2="560"/> <!-- 8 -->
    <line x1="740" y1="130" x2="740" y2="560"/> <!-- 9 -->
    <line x1="803.3" y1="130" x2="803.3" y2="560"/> <!-- 10 -->
    <line x1="866.7" y1="130" x2="866.7" y2="560"/> <!-- 11 -->
    <line x1="930" y1="130" x2="930" y2="560"/> <!-- 12 -->
    <line x1="993.3" y1="130" x2="993.3" y2="560"/> <!-- 13 -->
    <line x1="1056.7" y1="130" x2="1056.7" y2="560"/> <!-- 14 -->
  </g>

  <!-- Axes -->
  <g stroke="#173B63" stroke-width="2.5">
    <line x1="170" y1="560" x2="1120" y2="560" marker-end="url(#arrow)"/>
    <line x1="170" y1="560" x2="170" y2="130" marker-end="url(#arrow)"/>
  </g>

  <!-- X axis labels -->
  <g class="tick" text-anchor="middle">
    <text x="170" y="590">0</text>
    <text x="233.3" y="590">1</text>
    <text x="296.7" y="590">2</text>
    <text x="360" y="590">3</text>
    <text x="423.3" y="590">4</text>
    <text x="486.7" y="590">5</text>
    <text x="550" y="590">6</text>
    <text x="613.3" y="590">7</text>
    <text x="676.7" y="590">8</text>
    <text x="740" y="590">9</text>
    <text x="803.3" y="590">10</text>
    <text x="930" y="590">12</text>
    <text x="1056.7" y="590">14</text>
  </g>
  <text x="645" y="620" class="axis-label" text-anchor="middle">Diferencia entre los dos niveles ΔL (dB)</text>

  <!-- Y axis labels -->
  <g class="tick" text-anchor="end">
    <text x="158" y="135">3.0</text>
    <text x="158" y="201.7">2.5</text>
    <text x="158" y="273.3">2.0</text>
    <text x="158" y="345">1.5</text>
    <text x="158" y="416.7">1.0</text>
    <text x="158" y="488.3">0.5</text>
    <text x="158" y="564">0</text>
  </g>
  <text x="60" y="345" class="axis-label" text-anchor="middle" transform="rotate(-90 60 345)">Sumar al nivel mayor (dB)</text>

  <!-- Curve: points (diff, add) -->
  <!-- x = 170 + diff*63.33 ; y = 560 - add*143.33 -->
  <polyline fill="none" stroke="#E05A47" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
    points="170,560
            233.3,201.7
            296.7,259
            360,302
            423.3,345
            486.7,388
            550,416.7
            613.3,445.3
            676.7,474
            740,488.3
            803.3,502.7
            866.7,517
            930,531.3
            993.3,531.3
            1056.7,545.7
            1120,545.7"/>

  <!-- Key points -->
  <circle cx="170" cy="560" r="6" fill="#E05A47"/>
  <circle cx="360" cy="302" r="6" fill="#E05A47"/>
  <circle cx="486.7" cy="388" r="6" fill="#E05A47"/>
  <circle cx="803.3" cy="502.7" r="6" fill="#E05A47"/>

  <!-- Labels on key points -->
  <g class="point">
    <text x="185" y="555" text-anchor="start">0 dB → +3.0 dB</text>
    <text x="375" y="295" text-anchor="start">3 dB → +1.8 dB</text>
    <text x="500" y="380" text-anchor="start">5 dB → +1.2 dB</text>
    <text x="815" y="498" text-anchor="start">10 dB → +0.4 dB</text>
  </g>

  <text x="600" y="640" class="note" text-anchor="middle" display="none"></text>
</svg>
