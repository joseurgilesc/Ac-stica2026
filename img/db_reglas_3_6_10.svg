<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><style>.bg{fill:#f8fbfa}.card{fill:#fff;stroke:#d7e2df;stroke-width:2}.dark{fill:#243238}.muted{fill:#667781}.teal{fill:#249D8F}.amber{fill:#f4b63f}.title{font:700 34px system-ui,sans-serif}.big{font:700 30px system-ui,sans-serif}.h2{font:700 26px system-ui,sans-serif}.txt{font:20px system-ui,sans-serif}.sm{font:17px system-ui,sans-serif}</style><rect class="bg" width="1200" height="520" rx="24"/><text x="60" y="60" class="title dark">Tres reglas que no debes confundir</text><rect x="60" y="110" width="320" height="330" rx="18" class="card"/><rect x="440" y="110" width="320" height="330" rx="18" class="card"/><rect x="820" y="110" width="320" height="330" rx="18" class="card"/><text x="220" y="165" text-anchor="middle" class="big teal">+3 dB</text><text x="220" y="205" text-anchor="middle" class="h2 dark">Potencia ×2</text><circle cx="190" cy="260" r="20" class="amber"/><circle cx="250" cy="260" r="20" class="amber"/><text x="220" y="330" text-anchor="middle" class="txt muted">La potencia se duplica.</text><text x="220" y="370" text-anchor="middle" class="sm muted">En presión: ×1.41.</text><text x="600" y="165" text-anchor="middle" class="big teal">+6 dB</text><text x="600" y="205" text-anchor="middle" class="h2 dark">Presión ×2</text><path d="M500 300 C530 240 560 360 590 300 S650 240 680 300" fill="none" stroke="#249D8F" stroke-width="7"/><text x="600" y="370" text-anchor="middle" class="txt muted">La amplitud se duplica.</text><text x="600" y="405" text-anchor="middle" class="sm muted">Eso equivale a ×4 en potencia.</text><text x="980" y="165" text-anchor="middle" class="big teal">+10 dB</text><text x="980" y="205" text-anchor="middle" class="h2 dark">Potencia ×10</text><g fill="#249D8F"><rect x="885" y="285" width="16" height="55"/><rect x="910" y="270" width="16" height="70"/><rect x="935" y="255" width="16" height="85"/><rect x="960" y="240" width="16" height="100"/><rect x="985" y="225" width="16" height="115"/><rect x="1010" y="240" width="16" height="100"/><rect x="1035" y="255" width="16" height="85"/><rect x="1060" y="270" width="16" height="70"/></g><text x="980" y="390" text-anchor="middle" class="txt muted">Cambio relativo grande de energía.</text><text x="60" y="485" class="txt dark">Resumen:</text><text x="170" y="485" class="txt muted">+3 dB → potencia, +6 dB → presión, +10 dB → ×10 potencia.</text></svg>