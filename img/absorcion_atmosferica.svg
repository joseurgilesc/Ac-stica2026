<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Absorción atmosférica del sonido</title>
  <desc id="description">Curvas de atenuación atmosférica en dB por 100 metros para frecuencias de 125 Hz a 8 kHz, en función de la humedad relativa.</desc>
  <defs>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #173B63; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 17px; fill: #587086; }
      .axis-label { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #173B63; }
      .tick { font-family: Inter, Arial, sans-serif; font-size: 15px; fill: #445B70; }
      .legend { font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 600; }
      .note { font-family: Inter, Arial, sans-serif; font-size: 15px; fill: #587086; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#173B63"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#FFFFFF"/>

  <text x="600" y="52" class="title" text-anchor="middle">Absorción atmosférica del sonido</text>
  <text x="600" y="84" class="subtitle" text-anchor="middle">Atenuación en dB por cada 100 metros · aire a 20 °C · en función de la humedad relativa</text>

  <!-- Plot area: x = log(f) 125..8000, y = 0..10 dB/100m -->
  <!-- x: log10(125)=2.0969 .. log10(8000)=3.9031 -->
  <!-- x_px = 150 + (log10(f) - 2.0969) / (3.9031 - 2.0969) * 900 -->
  <!-- y_px = 520 - (v / 10) * 400 -->

  <!-- Horizontal grid lines (every 1 dB) -->
  <g stroke="#D8E1E9" stroke-width="1">
    <line x1="150" y1="520" x2="1050" y2="520"/>  <!-- 0 -->
    <line x1="150" y1="480" x2="1050" y2="480"/>  <!-- 1 -->
    <line x1="150" y1="440" x2="1050" y2="440"/>  <!-- 2 -->
    <line x1="150" y1="400" x2="1050" y2="400"/>  <!-- 3 -->
    <line x1="150" y1="360" x2="1050" y2="360"/>  <!-- 4 -->
    <line x1="150" y1="320" x2="1050" y2="320"/>  <!-- 5 -->
    <line x1="150" y1="280" x2="1050" y2="280"/>  <!-- 6 -->
    <line x1="150" y1="240" x2="1050" y2="240"/>  <!-- 7 -->
    <line x1="150" y1="200" x2="1050" y2="200"/>  <!-- 8 -->
    <line x1="150" y1="160" x2="1050" y2="160"/>  <!-- 9 -->
    <line x1="150" y1="120" x2="1050" y2="120"/>  <!-- 10 -->
  </g>

  <!-- Vertical grid lines (frequencies) -->
  <g stroke="#D8E1E9" stroke-width="1">
    <line x1="150" y1="120" x2="150" y2="520"/>   <!-- 125 -->
    <line x1="300" y1="120" x2="300" y2="520"/>   <!-- 250 -->
    <line x1="450" y1="120" x2="450" y2="520"/>   <!-- 500 -->
    <line x1="600" y1="120" x2="600" y2="520"/>   <!-- 1000 -->
    <line x1="750" y1="120" x2="750" y2="520"/>   <!-- 2000 -->
    <line x1="900" y1="120" x2="900" y2="520"/>   <!-- 4000 -->
    <line x1="1050" y1="120" x2="1050" y2="520"/> <!-- 8000 -->
  </g>

  <!-- Axes -->
  <g stroke="#173B63" stroke-width="2.5">
    <line x1="150" y1="520" x2="1050" y2="520" marker-end="url(#arrow)"/>
    <line x1="150" y1="520" x2="150" y2="120" marker-end="url(#arrow)"/>
  </g>

  <!-- X labels -->
  <g class="tick" text-anchor="middle">
    <text x="150" y="550">125</text>
    <text x="300" y="550">250</text>
    <text x="450" y="550">500</text>
    <text x="600" y="550">1 k</text>
    <text x="750" y="550">2 k</text>
    <text x="900" y="550">4 k</text>
    <text x="1050" y="550">8 k</text>
  </g>
  <text x="600" y="580" class="axis-label" text-anchor="middle">Frecuencia (Hz) — escala logarítmica</text>

  <!-- Y labels -->
  <g class="tick" text-anchor="end">
    <text x="138" y="524">0</text>
    <text x="138" y="440">2</text>
    <text x="138" y="360">4</text>
    <text x="138" y="280">6</text>
    <text x="138" y="200">8</text>
    <text x="138" y="124">10</text>
  </g>
  <text x="58" y="320" class="axis-label" text-anchor="middle" transform="rotate(-90 58 320)">Atenuación (dB por 100 m)</text>

  <!-- Curves: 5 humidity levels -->
  <!-- Points: (x, y) for 125, 250, 500, 1000, 2000, 4000, 8000 -->
  <!-- x: 150, 300, 450, 600, 750, 900, 1050 -->

  <!-- 10% HR (highest absorption at high freq) -->
  <!-- values: 0.04, 0.07, 0.15, 0.35, 1.1, 3.3, 9.0 -->
  <polyline fill="none" stroke="#C0392B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="150,518.4 300,517.2 450,514 600,506 750,476 900,388 1050,160"/>
  <text x="1060" y="158" class="legend" fill="#C0392B">10 % HR</text>

  <!-- 30% HR -->
  <!-- values: 0.04, 0.07, 0.14, 0.32, 0.9, 2.7, 7.2 -->
  <polyline fill="none" stroke="#E05A47" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="150,518.4 300,517.2 450,514.4 600,507.2 750,484 900,412 1050,232"/>
  <text x="1060" y="232" class="legend" fill="#E05A47">30 % HR</text>

  <!-- 50% HR -->
  <!-- values: 0.04, 0.07, 0.14, 0.30, 0.8, 2.4, 6.0 -->
  <polyline fill="none" stroke="#F39C12" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="150,518.4 300,517.2 450,514.4 600,508 750,488 900,424 1050,280"/>
  <text x="1060" y="280" class="legend" fill="#F39C12">50 % HR</text>

  <!-- 70% HR -->
  <!-- values: 0.04, 0.07, 0.14, 0.28, 0.7, 2.2, 5.0 -->
  <polyline fill="none" stroke="#249D8F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="150,518.4 300,517.2 450,514.4 600,508.8 750,492 900,432 1050,320"/>
  <text x="1060" y="320" class="legend" fill="#249D8F">70 % HR</text>

  <!-- 90% HR -->
  <!-- values: 0.04, 0.07, 0.13, 0.27, 0.6, 2.0, 4.3 -->
  <polyline fill="none" stroke="#1A7A6F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="150,518.4 300,517.2 450,514.8 600,509.2 750,496 900,440 1050,348"/>
  <text x="1060" y="348" class="legend" fill="#1A7A6F">90 % HR</text>

  <!-- Highlight: 8 kHz, 10% vs 90% -->
  <g stroke="#C0392B" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6">
    <line x1="1050" y1="160" x2="1050" y2="348"/>
  </g>
  <text x="1055" y="254" class="note" fill="#C0392B" text-anchor="start" transform="rotate(0)">
    A 8 kHz, la absorción con 10 % HR es ~2 veces mayor que con 90 % HR</text>

  <!-- Note at bottom -->
  <text x="600" y="615" class="note" text-anchor="middle">Por debajo de 500 Hz la absorción es casi despreciable e independiente de la humedad. En agudos, el aire seco atenúa mucho más.</text>
  <text x="600" y="645" class="note" text-anchor="middle" fill="#999">Valores aproximados según ISO 9613-1 · aire a 20 °C y 1 atm.</text>
</svg>
