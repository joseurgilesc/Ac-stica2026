<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ley de reflexión especular</title>
  <desc id="desc">El ángulo de incidencia es igual al ángulo de reflexión y la trayectoria puede interpretarse mediante una fuente imagen.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#17324d"/></marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d95d39"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="10" stroke="#17324d" stroke-width="3"/></pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .title { fill:#17324d; font-size:34px; font-weight:760; }
      .subtitle { fill:#52687a; font-size:18px; }
      .label { fill:#17324d; font-size:21px; font-weight:650; }
      .small { fill:#52687a; font-size:16px; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f7f9fb"/>

  <text x="600" y="54" text-anchor="middle" class="sans title">Ley de reflexión especular</text>
  <text x="600" y="85" text-anchor="middle" class="sans subtitle">El ángulo de incidencia es igual al ángulo de reflexión: θᵢ = θᵣ</text>
  <rect x="90" y="112" width="1020" height="505" rx="18" fill="#ffffff" stroke="#cbd5dd" stroke-width="1.5"/>
  <line x1="650" y1="390" x2="140" y2="390" stroke="#52687a" stroke-width="2.2"/>
  <text x="150" y="377" class="sans small">Normal a la pared</text>

  <line x1="260" y1="245" x2="650" y2="390" stroke="#d95d39" stroke-width="4" marker-end="url(#arrow-coral)"/>
  <line x1="650" y1="390" x2="260" y2="535" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <line x1="650" y1="390" x2="1040" y2="245" stroke="#52687a" stroke-width="2.4" stroke-dasharray="10 9"/>
  <line x1="260" y1="245" x2="1040" y2="245" stroke="#52687a" stroke-width="1.8"/>
  <path d="M616,245 h34 v34" fill="none" stroke="#17324d" stroke-width="2"/>
  <text x="599" y="269" text-anchor="end" class="sans small">90°</text>
  <path d="M556.00,390.00 A94.00,94.00 0 0 1 561.89,357.24" fill="none" stroke="#d99b20" stroke-width="4"/>
  <path d="M561.89,422.76 A94.00,94.00 0 0 1 556.00,390.00" fill="none" stroke="#d99b20" stroke-width="4"/>

  <rect x="650.0" y="145.0" width="18" height="440.0" fill="url(#hatch)"/>
  <line x1="650.0" y1="145.0" x2="650.0" y2="585.0" stroke="#17324d" stroke-width="5"/>
  <text x="659.0" y="619.0" text-anchor="middle" class="sans label">Pared</text>

  <circle cx="260" cy="245" r="13" fill="#17324d"/>
  <text x="260" y="217" text-anchor="middle" class="sans label">Fuente</text>
  <circle cx="260" cy="535" r="13" fill="#0f766e"/>
  <text x="260" y="573" text-anchor="middle" class="sans label">Oyente</text>
  <circle cx="1040" cy="245" r="13" fill="#ffffff" stroke="#6d28d9" stroke-width="4"/>
  <text x="1035" y="217" text-anchor="middle" class="sans label" fill="#6d28d9">Fuente imagen</text>
  <circle cx="650" cy="390" r="8" fill="#d99b20" stroke="#ffffff" stroke-width="3"/>
  <text x="546" y="345" text-anchor="middle" class="serif" font-size="28" font-style="italic" fill="#17324d">θᵢ</text>
  <text x="546" y="454" text-anchor="middle" class="serif" font-size="28" font-style="italic" fill="#17324d">θᵣ</text>

  <rect x="150" y="640" width="900" height="72" rx="14" fill="#17324d"/>
  <text x="600" y="670" text-anchor="middle" class="sans" font-size="19" font-weight="700" fill="#ffffff">θᵢ = θᵣ</text>
  <text x="600" y="697" text-anchor="middle" class="sans" font-size="16" fill="#c7d6df">La prolongación del rayo reflejado pasa por la fuente imagen, situada a la misma distancia detrás de la pared.</text>
</svg>