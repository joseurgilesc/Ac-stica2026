<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><style>.bg{fill:#f8fbfa}.dark{fill:#243238}.muted{fill:#60727d}.teal{fill:#249D8F}.soft{fill:#dff3ef}.line{stroke:#9fb7b2;stroke-width:2}.title{font:700 34px system-ui,sans-serif}.h2{font:700 24px system-ui,sans-serif}.txt{font:20px system-ui,sans-serif}.sm{font:17px system-ui,sans-serif}</style><rect class="bg" width="1200" height="620" rx="24"/><text x="60" y="60" class="title dark">Escala lineal vs. escalera logarítmica</text><text x="60" y="95" class="txt muted">Cada escalón representa multiplicar ×10 en presión y sumar +20 dB SPL.</text><text x="80" y="150" class="h2 dark">Si piensas linealmente…</text><line x1="80" y1="210" x2="530" y2="210" class="line"/><circle cx="100" cy="210" r="8" class="teal"/><circle cx="140" cy="210" r="8" class="teal"/><circle cx="260" cy="210" r="8" class="teal"/><circle cx="520" cy="210" r="8" class="teal"/><text x="90" y="245" class="sm dark">1</text><text x="126" y="245" class="sm dark">10</text><text x="244" y="245" class="sm dark">100</text><text x="495" y="245" class="sm dark">1000</text><text x="80" y="285" class="txt muted">Los números crecen demasiado rápido y se vuelven incómodos de representar.</text><text x="650" y="150" class="h2 dark">Si piensas logarítmicamente…</text><g transform="translate(700,190)"><rect x="0" y="280" width="330" height="52" rx="10" class="soft"/><rect x="0" y="220" width="275" height="52" rx="10" class="soft"/><rect x="0" y="160" width="220" height="52" rx="10" class="soft"/><rect x="0" y="100" width="165" height="52" rx="10" class="soft"/><rect x="0" y="40" width="110" height="52" rx="10" class="soft"/><rect x="0" y="-20" width="55" height="52" rx="10" class="soft"/><text x="18" y="14" class="txt dark">20 µPa</text><text x="120" y="14" class="txt teal">0 dB</text><text x="18" y="74" class="txt dark">200 µPa</text><text x="120" y="74" class="txt teal">20 dB</text><text x="18" y="134" class="txt dark">2 mPa</text><text x="120" y="134" class="txt teal">40 dB</text><text x="18" y="194" class="txt dark">20 mPa</text><text x="120" y="194" class="txt teal">60 dB</text><text x="18" y="254" class="txt dark">0.2 Pa</text><text x="120" y="254" class="txt teal">80 dB</text><text x="18" y="314" class="txt dark">2 Pa</text><text x="120" y="314" class="txt teal">100 dB</text></g><text x="60" y="560" class="txt dark">Idea clave:</text><text x="180" y="560" class="txt muted">Los decibeles no cuentan cuánto sumamos; cuentan cuántas veces multiplicamos.</text></svg>