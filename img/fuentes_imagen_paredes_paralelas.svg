<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="650" viewBox="0 0 1300 650" role="img" aria-labelledby="title desc">
  <title id="title">Fuentes imagen entre paredes paralelas</title>
  <desc id="desc">Una fuente real entre dos paredes paralelas produce una secuencia de fuentes virtuales de primer, segundo y tercer orden.</desc>
  <defs>
