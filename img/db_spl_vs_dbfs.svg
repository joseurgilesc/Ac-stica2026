<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><style>.bg{fill:#f8fbfa}.shaft{fill:#ecf4f2;stroke:#d2e1de;stroke-width:2}.car1{fill:#249D8F}.car2{fill:#f4b63f}.dark{fill:#243238}.muted{fill:#64757f}.title{font:700 34px system-ui,sans-serif}.h2{font:700 26px system-ui,sans-serif}.txt{font:20px system-ui,sans-serif}.sm{font:17px system-ui,sans-serif}</style><rect class="bg" width="1200" height="620" rx="24"/><text x="60" y="60" class="title dark">Mismo “dB”, referencias distintas</text><text x="220" y="120" text-anchor="middle" class="h2 dark">dB SPL</text><text x="220" y="150" text-anchor="middle" class="sm muted">Presión en el aire</text><rect x="150" y="180" width="140" height="340" rx="20" class="shaft"/><rect x="165" y="430" width="110" height="70" rx="14" class="car1"/><text x="220" y="472" text-anchor="middle" class="txt" fill="#fff">0 dB SPL</text><text x="315" y="490" class="sm dark">Referencia</text><text x="315" y="430" class="sm dark">20 dB</text><text x="315" y="380" class="sm dark">40 dB</text><text x="315" y="330" class="sm dark">60 dB</text><text x="315" y="280" class="sm dark">80 dB</text><text x="315" y="230" class="sm dark">100 dB</text><text x="315" y="190" class="sm dark">120 dB</text><text x="220" y="550" text-anchor="middle" class="txt muted">Subes hacia niveles más altos</text><text x="840" y="120" text-anchor="middle" class="h2 dark">dBFS</text><text x="840" y="150" text-anchor="middle" class="sm muted">Escala digital</text><rect x="770" y="180" width="140" height="340" rx="20" class="shaft"/><rect x="785" y="200" width="110" height="70" rx="14" class="car2"/><text x="840" y="242" text-anchor="middle" class="txt" fill="#fff">0 dBFS</text><text x="925" y="220" class="sm dark">Techo digital</text><text x="925" y="285" class="sm dark">−6 dBFS</text><text x="925" y="335" class="sm dark">−12 dBFS</text><text x="925" y="385" class="sm dark">−18 dBFS</text><text x="925" y="435" class="sm dark">−30 dBFS</text><text x="925" y="490" class="sm dark">−∞ dBFS</text><text x="840" y="550" text-anchor="middle" class="txt muted">Bajas hacia el silencio digital</text><text x="60" y="595" class="txt dark">Idea clave:</text><text x="180" y="595" class="txt muted">0 dB SPL es una referencia física; 0 dBFS es el máximo digital.</text></svg>