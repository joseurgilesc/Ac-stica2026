<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Campos sonoros y distancia crítica</title>
  <desc id="desc">Gráfico vectorial con distancia en escala logarítmica base dos. El sonido directo disminuye 6,02 decibelios por duplicación, el nivel reverberante permanece constante y el nivel total se aproxima al reverberante a gran distancia.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#19324a"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d45a3a"/>
    </marker>
    <clipPath id="plot-clip"><rect x="155" y="225" width="925" height="450" rx="12"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#19324a" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .axis { stroke:#19324a; stroke-width:2.2; }
      .grid-major { stroke:#aeb9c2; stroke-width:1.25; }
      .grid-minor { stroke:#d9e0e5; stroke-width:1; }
      .tick { fill:#243746; font-size:20px; }
      .label { fill:#19324a; font-size:22px; }
      .small { fill:#506575; font-size:17px; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f7f9fb"/>
  <text x="600" y="58" text-anchor="middle" class="sans" font-size="34" font-weight="750" fill="#19324a">Campos sonoros y distancia crítica</text>
  <text x="600" y="91" text-anchor="middle" class="sans" font-size="18" fill="#506575">Distancia en escala logarítmica base 2 · propagación en un recinto</text>

  <!-- Franjas superiores de campo -->
  <line x1="155.00" y1="132" x2="309.17" y2="132" stroke="#19324a" stroke-width="2.2" marker-start="url(#arrow-navy)" marker-end="url(#arrow-navy)"/>
  <text x="232.08" y="121" text-anchor="middle" class="sans" font-size="19" font-weight="650" fill="#19324a">Campo cercano</text>
  <line x1="309.17" y1="132" x2="1080.00" y2="132" stroke="#19324a" stroke-width="2.2" marker-start="url(#arrow-navy)" marker-end="url(#arrow-navy)"/>
  <text x="694.58" y="121" text-anchor="middle" class="sans" font-size="19" font-weight="650" fill="#19324a">Campo lejano</text>

  <line x1="309.17" y1="180" x2="707.68" y2="180" stroke="#0f766e" stroke-width="2.4" marker-start="url(#arrow-navy)" marker-end="url(#arrow-navy)"/>
  <text x="508.42" y="169" text-anchor="middle" class="sans" font-size="19" font-weight="700" fill="#0f766e">Predominio del campo libre</text>
  <line x1="707.68" y1="180" x2="1080.00" y2="180" stroke="#7c3aed" stroke-width="2.4" marker-start="url(#arrow-navy)" marker-end="url(#arrow-navy)"/>
  <text x="893.84" y="169" text-anchor="middle" class="sans" font-size="19" font-weight="700" fill="#6d28d9">Predominio reverberante</text>

