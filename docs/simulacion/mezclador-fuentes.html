<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mezclador de fuentes — Suma de niveles sonoros</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f0; font-family: system-ui, sans-serif; color: #172033; }
    #mixer { max-width: 900px; margin: 0 auto; padding: 16px; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 8px 0; }
    .row label { min-width: 90px; font-weight: 600; }
    .stat { padding: 12px 14px; background: #eef3ff; border-radius: 12px; min-width: 140px; flex: 1; }
    .stat .lbl { font-size: 12px; color: #526079; margin-bottom: 4px; }
    .stat .val { font-weight: 700; font-size: 16px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
    .highlight { background: #e6f7f3; border-left: 4px solid #249D8F; }
    button { padding: 8px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; border: 1px solid #aab5c8; background: #fff; }
    button.active { background: #249D8F; color: #fff; border-color: #249D8F; }
    canvas { display: block; margin: 14px 0; border: 1px solid #d8deea; border-radius: 12px; }
  </style>
</head>
<body>
<div id="mixer">
<script>
const TEAL = [36, 157, 143];
const CORAL = [224, 90, 71];
const INDIGO = [79, 111, 178];

const TABLE = [
  { d: 0, c: 3.0 }, { d: 1, c: 2.5 }, { d: 2, c: 2.1 }, { d: 3, c: 1.8 },
  { d: 4, c: 1.5 }, { d: 5, c: 1.2 }, { d: 6, c: 1.0 }, { d: 7, c: 0.8 },
  { d: 8, c: 0.6 }, { d: 9, c: 0.5 }, { d: 10, c: 0.4 }, { d: 11, c: 0.3 },
  { d: 12, c: 0.2 },
];

let sliderA, sliderB;
let valDiff, valCorr, valApprox, valExact;
let coherent = false;
let btnMode;
let time = 0;

// Display frequencies (low for clarity)
const F_A = 1.0;       // cycles across screen for source A
const F_B_COHERENT = 1.0;   // same freq when coherent
const F_B_INCOHERENT = 1.8; // different freq when incoherent

function setup() {
  const root = select('#mixer');

  const heading = createElement('h2', 'Suma de dos fuentes sonoras');
  heading.parent(root);

  const lead = createP('Observa cómo se superponen las ondas. Dos ondas en fase duplican la amplitud (+6 dB); dos ondas distintas suman energía (+3 dB).');
  lead.parent(root);
  lead.style('color', '#526079');

  // Source A
  const rowA = createDiv('');
  rowA.parent(root); rowA.addClass('row');
  createElement('label', 'Fuente A:').parent(rowA);
  sliderA = createSlider(40, 100, 70, 0.1);
  sliderA.parent(rowA); sliderA.style('flex', '1 1 300px');
  const valA = createSpan('70 dB'); valA.parent(rowA); valA.style('font-weight', '700');
  sliderA.input(() => { valA.html(sliderA.value() + ' dB'); update(); });

  // Source B
  const rowB = createDiv('');
  rowB.parent(root); rowB.addClass('row');
  createElement('label', 'Fuente B:').parent(rowB);
  sliderB = createSlider(40, 100, 70, 0.1);
  sliderB.parent(rowB); sliderB.style('flex', '1 1 300px');
  const valB = createSpan('70 dB'); valB.parent(rowB); valB.style('font-weight', '700');
  sliderB.input(() => { valB.html(sliderB.value() + ' dB'); update(); });

  // Mode toggle
  const rowMode = createDiv('');
  rowMode.parent(root); rowMode.addClass('row');
  createElement('label', 'Modo:').parent(rowMode);
  btnMode = createButton('Incoherente (frecuencias distintas)');
  btnMode.parent(rowMode);
  btnMode.mousePressed(() => {
    coherent = !coherent;
    btnMode.html(coherent ? 'Coherente (en fase)' : 'Incoherente (frecuencias distintas)');
    btnMode.toggleClass('active', coherent);
    update();
  });

  // Stats
  const stats = createDiv('');
  stats.parent(root); stats.addClass('stats');
  valDiff = createStat(stats, 'Diferencia ΔL');
  valCorr = createStat(stats, 'Corrección (tabla)');
  valApprox = createStat(stats, 'Resultado aproximado');
  valExact = createStat(stats, 'Resultado exacto');
  valExact.parent().addClass('highlight');

  // Canvas
  const cw = min(860, windowWidth - 40);
  createCanvas(cw, 420).parent(root);

  textFont('system-ui');
  update();
}

function draw() {
  background(255);
  time += deltaTime * 0.001;

  const LA = Number(sliderA.value());
  const LB = Number(sliderB.value());
  // Exact sum depends on mode: coherent (pressure sum) vs incoherent (energy sum)
  const Lsum = coherent
    ? 20 * Math.log10(Math.pow(10, LA/20) + Math.pow(10, LB/20))
    : 10 * Math.log10(Math.pow(10, LA/10) + Math.pow(10, LB/10));

  // Amplitudes (pressure, proportional to 10^(L/20)), normalized to 70 dB = 1.0
  const ampA = Math.pow(10, (LA - 70) / 20);
  const ampB = Math.pow(10, (LB - 70) / 20);

  const fB = coherent ? F_B_COHERENT : F_B_INCOHERENT;

  // Normalize display scale to the max amplitude present
  const maxAmp = Math.max(ampA, ampB, ampA + ampB, 0.5);

  const GX = 40;
  const GW = width - 80;
  const panelH = 110;
  const top1 = 20;

  // ── Panel 1: Fuente A ──
  drawWavePanel(GX, top1, GW, panelH, 'Fuente A (' + LA.toFixed(1) + ' dB)', ampA / maxAmp, F_A, 0, TEAL);

  // ── Panel 2: Fuente B ──
  drawWavePanel(GX, top1 + panelH + 5, GW, panelH, 'Fuente B (' + LB.toFixed(1) + ' dB)', ampB / maxAmp, fB, 0, coherent ? INDIGO : CORAL);

  // ── Panel 3: Suma ──
  drawSumPanel(GX, top1 + 2 * (panelH + 5), GW, panelH, 'Suma (' + Lsum.toFixed(1) + ' dB)', ampA, ampB, fB, maxAmp);
}

function drawWavePanel(x, y, w, h, label, amp, freq, phase, color) {
  // Panel background
  noStroke();
  fill(248, 250, 255);
  rect(x, y, w, h, 8);

  // Center line
  stroke(0, 0, 0, 20);
  strokeWeight(1);
  line(x + 10, y + h / 2, x + w - 10, y + h / 2);

  // Label
  noStroke();
  fill(23, 32, 51);
  textAlign(LEFT, TOP);
  textSize(12);
  textStyle(BOLD);
  text(label, x + 12, y + 6);
  textStyle(NORMAL);

  // Wave
  noFill();
  stroke(color[0], color[1], color[2]);
  strokeWeight(2);
  beginShape();
  for (let i = 0; i <= 200; i++) {
    let wx = x + 10 + (i / 200) * (w - 20);
    let val = amp * Math.sin(i / 200 * TWO_PI * freq + time * 2 * freq + phase);
    vertex(wx, y + h / 2 - val * (h / 2 - 10));
  }
  endShape();
}

function drawSumPanel(x, y, w, h, label, ampA, ampB, fB, maxAmp) {
  // Panel background
  noStroke();
  fill(230, 247, 243);
  rect(x, y, w, h, 8);

  // Center line
  stroke(0, 0, 0, 20);
  strokeWeight(1);
  line(x + 10, y + h / 2, x + w - 10, y + h / 2);

  // Label
  noStroke();
  fill(23, 32, 51);
  textAlign(LEFT, TOP);
  textSize(12);
  textStyle(BOLD);
  text(label, x + 12, y + 6);
  textStyle(NORMAL);

  // Sum wave (algebraic sum of A and B)
  noFill();
  stroke(26, 122, 111);
  strokeWeight(2.5);
  beginShape();
  for (let i = 0; i <= 200; i++) {
    let wx = x + 10 + (i / 200) * (w - 20);
    let valA = ampA * Math.sin(i / 200 * TWO_PI * F_A + time * 2 * F_A);
    let valB = ampB * Math.sin(i / 200 * TWO_PI * fB + time * 2 * fB);
    let sum = (valA + valB) / maxAmp;
    vertex(wx, y + h / 2 - sum * (h / 2 - 10));
  }
  endShape();
}

function update() {
  if (!sliderA) return;
  const L1 = Number(sliderA.value());
  const L2 = Number(sliderB.value());
  const higher = Math.max(L1, L2);
  const lower = Math.min(L1, L2);
  const diff = higher - lower;

  let corr = 0;
  for (const t of TABLE) {
    if (diff >= t.d) corr = t.c;
    else break;
  }
  if (diff > 12) corr = 0.1;

  const approx = higher + corr;
  const exact = coherent
    ? 20 * Math.log10(Math.pow(10, L1/20) + Math.pow(10, L2/20))
    : 10 * Math.log10(Math.pow(10, L1/10) + Math.pow(10, L2/10));

  valDiff.html(diff.toFixed(1) + ' dB');

  if (coherent) {
    // The sum table applies only to incoherent (energy) addition
    valCorr.html('N/A (presión)');
    valApprox.html('N/A (tabla incoherente)');
  } else {
    valCorr.html('+' + corr.toFixed(1) + ' dB');
    valApprox.html(approx.toFixed(1) + ' dB');
  }
  valExact.html(exact.toFixed(2) + ' dB');
}

function createStat(parent, label) {
  const card = createDiv('');
  card.parent(parent); card.addClass('stat');
  const lbl = createDiv(label); lbl.parent(card); lbl.addClass('lbl');
  const val = createDiv(''); val.parent(card); val.addClass('val');
  return val;
}

function windowResized() {
  const cw = min(860, windowWidth - 40);
  resizeCanvas(cw, 420);
}
</script>
</div>
</body>
</html>
