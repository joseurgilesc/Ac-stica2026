<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulación: Compresión y Rarefacción del Sonido</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #080816; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #panel {
      position: absolute; top: 0; left: 0; width: 220px; height: 100vh;
      background: rgba(5,5,18,0.95); color: #fff; padding: 12px;
      font-size: 11px; z-index: 5; overflow-y: auto;
      border-right: 1px solid rgba(255,255,255,0.06);
    }
    #panel h3 { margin: 0 0 6px; font-size: 13px; color: #f0a030; }
    #panel button { width: 100%; margin: 3px 0; padding: 6px 8px; border: none; border-radius: 4px; cursor: pointer; background: #1a2744; color: #ccc; font-size: 11px; }
    #panel button:hover { background: #243b63; }
    #panel select { width: 100%; padding: 4px; background: #1a2744; color: #ccc; border: 1px solid #333; border-radius: 4px; font-size: 11px; margin-bottom: 4px; }
    #panel input[type=range] { width: 100%; accent-color: #f0a030; margin: 3px 0; }
    #panel label { display: block; margin: 6px 0 2px; color: #aaa; font-size: 10px; }
    #panel .val { color: #f0a030; font-weight: bold; }
    #panel .legend { margin-top: 10px; padding: 8px 10px; background: rgba(255,255,255,0.02); border-radius: 5px; font-size: 10px; line-height: 1.6; }
    #panel .section { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); }
  </style>
</head>
<body>

<div id="panel">
  <h3>🎵 Ondas de sonido</h3>
  <div class="section">
    <label>Frecuencia: <span class="val" id="fv">220 Hz</span></label>
    <select id="note-select">
      <option value="55">A1 — 55 Hz</option>
      <option value="110">A2 — 110 Hz</option>
      <option value="165">E3 — 165 Hz</option>
      <option value="220" selected>A3 — 220 Hz</option>
      <option value="262">C4 — 262 Hz (Do)</option>
      <option value="330">E4 — 330 Hz</option>
      <option value="440">A4 — 440 Hz (La)</option>
      <option value="524">C5 — 524 Hz</option>
      <option value="660">E5 — 660 Hz</option>
      <option value="880">A5 — 880 Hz</option>
    </select>
    <input type="range" id="freq" min="40" max="1200" value="220" step="1">
  </div>
  <div class="section">
    <label>Amplitud: <span class="val" id="av">1.0</span></label>
    <input type="range" id="amp" min="0.3" max="2.0" step="0.1" value="1.0">
  </div>
  <div class="section">
    <button id="btn-play">▶️ Activar sonido</button>
    <button id="btn-stop" style="display:none">⏸️ Silenciar</button>
  </div>
  <div class="legend">
    <b>Onda de desplazamiento:</b><br>
    <b style="color:#ff6666">⬆ Cresta = Compresión</b><br>
    Partículas se juntan — presión ↑<br><br>
    <b style="color:#6699ff">⬇ Valle = Rarefacción</b><br>
    Partículas se separan — presión ↓<br><br>
    La onda avanza →<br>
    Las partículas no viajan.
  </div>
</div>

<script>
let freq = 220, amp = 1.0, time = 0, playing = false;
let synth;
let particles = [];
let noiseOff = 0;

function setup() {
  createCanvas(windowWidth, windowHeight);
  textFont('system-ui');
  noiseSeed(42);

  synth = new Tone.Synth({
    oscillator: { type: 'sine' },
    envelope: { attack: 0.02, decay: 0.1, sustain: 0.4, release: 0.1 },
    volume: -14
  }).toDestination();

  // Create particle grid
  let cols = 60, rows = 10;
  for (let c = 0; c < cols; c++)
    for (let r = 0; r < rows; r++)
      particles.push({ col: c, row: r, nx: random(1000), ny: random(1000), x: 0, y: 0 });

  let fs = select('#freq'), as = select('#amp'), ns = select('#note-select');
  fs.input(() => {
    freq = parseFloat(fs.value()); select('#fv').html(freq + ' Hz');
    if (playing) synth.frequency.value = freq;
    let opts = ns.elt.options, best = opts[0];
    for (let o of opts) if (Math.abs(+o.value - freq) < Math.abs(+best.value - freq)) best = o;
    ns.elt.value = best.value;
  });
  ns.changed(() => { freq = parseFloat(ns.value()); fs.elt.value = freq; select('#fv').html(freq + ' Hz'); if (playing) synth.frequency.value = freq; });
  as.input(() => { amp = parseFloat(as.value()); select('#av').html(amp.toFixed(1)); });
  select('#btn-play').mousePressed(() => {
    if (Tone.context.state !== 'running') Tone.start();
    synth.frequency.value = freq; synth.triggerAttack(freq);
    playing = true; select('#btn-play').style('display', 'none'); select('#btn-stop').style('display', 'block');
  });
  select('#btn-stop').mousePressed(() => {
    synth.triggerRelease();
    playing = false; select('#btn-play').style('display', 'block'); select('#btn-stop').style('display', 'none');
  });
}

function draw() {
  background(8, 8, 22);

  let GX = 240, GW = width - GX - 30;
  let CY = height / 2 + 30;
  let maxAmp = 140 * amp;
  let visFreq = constrain(freq / 120, 0.3, 7);

  time += deltaTime * 0.001;
  noiseOff += deltaTime * 0.0002;

  let cols = 60, rows = 10;
  let colW = GW / cols;
  let rowH = (maxAmp * 2 + 50) / rows;
  let gridTop = CY - maxAmp - 25;

  // ── Draw crest (compression) and trough (rarefaction) highlight zones ──
  noStroke();
  for (let x = GX; x < GX + GW; x += 4) {
    let phase = ((x - GX) / GW) * TWO_PI * visFreq + time * 2;
    let val = sin(phase);
    let a;
    if (val > 0.05) { a = map(val, 0.05, 1, -20, 40); fill(255, 60, 60, a); }
    else if (val < -0.05) { a = map(-val, 0.05, 1, -20, 40); fill(60, 80, 255, a); }
    else continue;
    rect(x - 1, gridTop, 3, maxAmp * 2 + 50);
  }

  // ── Particles ──
  noStroke();
  let prevX = 0;

  for (let p of particles) {
    let col = p.col, row = p.row;
    let baseX = GX + col * colW + colW / 2;
    let baseY = gridTop + row * rowH + rowH / 2;

    let phase = (col / cols) * TWO_PI * visFreq + time * 2;
    let waveVal = sin(phase);

    // Simple local clustering based on wave value at this column
    // Compare to adjacent columns: if crest (waveVal > 0), compress spacing
    // If trough (waveVal < 0), expand spacing
    let phasePrev = ((col - 1) / cols) * TWO_PI * visFreq + time * 2;
    let slope = sin(phase) - sin(phasePrev);

    // At crest (waveVal > 0): shift particles toward each other
    // At trough (waveVal < 0): shift particles away from each other
    let clusterStrength = -waveVal;  // negative at crest = pull together, positive at trough = push apart
    let shiftX = clusterStrength * colW * 0.35 * amp;

    // Perlin noise
    let nx = noise(p.nx + noiseOff) - 0.5;
    let ny = noise(p.ny + noiseOff) - 0.5;

    p.x = baseX + shiftX + nx * 4 * amp;
    p.y = baseY + ny * 4 * amp;

    // Size: smaller at compression (dense), larger at rarefaction (spread)
    let sz = waveVal > 0 ? 4.5 - waveVal * 1.5 : 4.5 + (-waveVal) * 2;

    // Color
    let r, g, b, alpha;
    if (waveVal > 0.04) {
      let t = constrain(waveVal, 0, 1);
      r = 255; g = lerp(160, 45, t); b = lerp(160, 45, t);
      alpha = lerp(80, 230, t);
    } else if (waveVal < -0.04) {
      let t = constrain(-waveVal, 0, 1);
      r = lerp(160, 45, t); g = lerp(160, 105, t); b = 255;
      alpha = lerp(80, 230, t);
    } else {
      r = 140; g = 140; b = 160; alpha = 40;
    }
    fill(r, g, b, alpha);
    ellipse(p.x, p.y, sz, sz);
  }

  // ── Sine wave line ──
  stroke(180, 220, 255, 200);
  strokeWeight(3);
  noFill();
  beginShape();
  for (let i = 0; i <= 400; i++) {
    let x = GX + (i / 400) * GW;
    let phase = (i / 400) * TWO_PI * visFreq + time * 2;
    vertex(x, CY - sin(phase) * maxAmp);
  }
  endShape();

  // Center line
  stroke(255, 255, 255, 12);
  strokeWeight(0.5);
  line(GX, CY, GX + GW, CY);
  noStroke();

  // ── Labels ──
  textAlign(CENTER, TOP);
  textSize(16);
  fill(255, 210, 80);
  text('⬆ CRESTA = COMPRESIÓN (partículas juntas)', GX + GW / 2, 22);
  textSize(12);
  fill(180, 180, 200);
  text(`Frecuencia: ${freq} Hz  ·  Amplitud: ${amp.toFixed(1)}  ·  Cresta → 🔴  |  Valle → 🔵`, GX + GW / 2, 44);

  // Wavelength
  if (visFreq <= 5) {
    let lamW = GW / visFreq, lx = GX + 15, ly = gridTop - 12;
    stroke(255, 200, 80, 80);
    strokeWeight(1.5);
    line(lx, ly, lx + lamW, ly);
    line(lx, ly - 4, lx, ly + 4);
    line(lx + lamW, ly - 4, lx + lamW, ly + 4);
    noStroke();
    fill(255, 200, 80, 120);
    textSize(10);
    text(`λ = (344 m/s) ÷ ${freq} Hz = ${(344/freq).toFixed(2)} m`, lx + lamW / 2, ly + 5);
  }

  // Bottom
  let barY = height - 42;
  stroke(255, 255, 255, 25);
  strokeWeight(1);
  line(GX, barY, GX + GW, barY);
  line(GX + GW, barY, GX + GW - 8, barY - 3);
  line(GX + GW, barY, GX + GW - 8, barY + 3);
  noStroke();
  fill(255, 255, 255, 70);
  textSize(10);
  text('→ Propagación de la onda | Partículas con ruido Perlin natural | Solo vibran, no viajan', GX + GW / 2, barY + 9);
  fill(playing ? '#80ff80' : '#555');
  text(playing ? '🔊 Sonido activo' : '🔇 Silencio', GX + GW / 2, height - 15);
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>
</body>
</html>
