<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulación: El cuerpo como fuente sonora</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #0d0d1a; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #panel {
      position: absolute; top: 0; left: 0; width: 260px; height: 100vh;
      background: rgba(8,8,22,0.94); color: #fff; padding: 14px;
      font-size: 12px; z-index: 5; overflow-y: auto;
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    #panel h3 { margin: 0 0 8px; font-size: 14px; color: #f0a030; }
    #panel button {
      width: 100%; margin: 4px 0; padding: 7px 10px;
      border: none; border-radius: 5px; cursor: pointer;
      background: #162447; color: #ccc; font-size: 12px;
    }
    #panel button:hover { background: #1f4287; }
    #panel .status { margin: 8px 0; padding: 6px 10px; border-radius: 5px; font-size: 11px; text-align: center; }
    .status.off { background: rgba(255,255,255,0.04); color: #777; }
    .status.on { background: rgba(0,200,80,0.1); color: #0f8; border: 1px solid rgba(0,200,80,0.15); }
    #panel input[type=range] { width: 100%; accent-color: #f0a030; }
    #panel label { display: block; margin: 6px 0 2px; color: #aaa; font-size: 11px; }
    #panel .legend { margin-top: 14px; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 6px; font-size: 11px; line-height: 1.6; }
    #panel .legend b { color: #f0a030; }
    .color-red { color: #ff5555; }
    .color-blue { color: #5588ff; }
  </style>
</head>
<body>

<div id="panel">
  <h3>🔊 Fuente sonora virtual</h3>
  <div class="status off" id="status">🖱️ Modo mouse</div>

  <button id="btn-cam">📷 Activar cámara</button>
  <button id="btn-mouse">🖱️ Usar mouse</button>
  <button id="btn-reset">🔄 Reiniciar</button>

  <label>Amplitud: <b id="val-amp">1.0</b></label>
  <input type="range" id="amp" min="0.3" max="2.5" step="0.1" value="1.0">

  <label>
    <input type="checkbox" id="show-labels" checked> Etiquetas
  </label>
  <label>
    <input type="checkbox" id="show-cam"> Ver cámara
  </label>

  <div class="legend">
    <b class="color-red">🔴 Compresión</b><br>
    → Las partículas se juntan.<br>
    → Presión mayor que la atmosférica.<br><br>
    <b class="color-blue">🔵 Rarefacción</b><br>
    → Las partículas se separan.<br>
    → Presión menor que la atmosférica.<br><br>
    <b>⚡ La onda avanza →</b><br>
    Las partículas <b>no viajan</b> con la onda.<br>
    Vibran en su lugar y vuelven.
  </div>
</div>

<script>
const COLS = 40, ROWS = 8;
const CELL = 22;
const GX = 300, GY = 280;
let particles = [];
let sourceX, targetX;
let useCam = false, camReady = false;
let handpose, video;
let mouseOn = true;
let lastPred = 0;
let handX = 0, handDet = false;
let ampVal = 1.0, showLabels = true, showCam = false;

function setup() {
  createCanvas(windowWidth, windowHeight);
  textFont('system-ui');

  for (let c = 0; c < COLS; c++)
    for (let r = 0; r < ROWS; r++)
      particles.push({
        bx: GX + c * CELL, by: GY + r * CELL,
        x: GX + c * CELL, y: GY + r * CELL,
        ph: random(TWO_PI), c: c, r: r
      });

  sourceX = GX + 2 * CELL;
  targetX = sourceX;

  select('#btn-reset').mousePressed(() => { sourceX = targetX = GX + 2 * CELL; });
  select('#amp').input(() => { ampVal = parseFloat(select('#amp').value()); select('#val-amp').html(ampVal.toFixed(1)); });
  select('#show-labels').changed(() => showLabels = select('#show-labels').checked());
  select('#show-cam').changed(() => showCam = select('#show-cam').checked());

  select('#btn-cam').mousePressed(() => {
    select('#status').removeClass('on').addClass('off').html('⏳ Iniciando cámara...');
    startCam();
  });
  select('#btn-mouse').mousePressed(() => {
    useCam = false; camReady = false; mouseOn = true;
    if (video) { video.remove(); video = null; }
    select('#status').removeClass('on').addClass('off').html('🖱️ Modo mouse');
  });
}

function startCam() {
  video = createCapture(VIDEO, () => {});
  video.size(640, 480);
  video.hide();
  handpose = ml5.handpose(video, { flipHorizontal: true, runtime: 'tfjs' }, () => {
    camReady = true; useCam = true; mouseOn = false;
    select('#status').removeClass('off').addClass('on').html('📷 Cámara activa');
  });
}

function draw() {
  background(13, 13, 26);

  // ── Input ──
  if (useCam && camReady && handpose && millis() - lastPred > 80) {
    lastPred = millis();
    handpose.predict(function(err, results) {
      handDet = false;
      if (!err && results && results.length > 0) {
        let wrist = results[0].landmarks ? results[0].landmarks[0] : null;
        if (wrist) { handDet = true; handX = wrist[0]; }
      }
      if (handDet) {
        let nx = constrain(handX / 640, 0, 1);
        targetX = GX + 2 * CELL + (nx - 0.5) * (COLS - 4) * CELL;
      }
    });
  } else if (mouseOn) {
    let mx = mouseX - GX;
    if (mx > -80 && mx < COLS * CELL + 80) {
      let nx = constrain(mx / (COLS * CELL), 0, 1);
      targetX = GX + 2 * CELL + (nx - 0.5) * (COLS - 4) * CELL;
    }
  }

  sourceX += (targetX - sourceX) * 0.3;
  sourceX = constrain(sourceX, GX + CELL, GX + (COLS - 2) * CELL);

  let displacement = (targetX - (GX + 2 * CELL)) * ampVal;

  // ── Draw bands (background) ──
  noStroke();
  for (let c = 0; c < COLS; c++) {
    let p = particles[c * ROWS];
    let osc = p.x - p.bx;
    if (abs(osc) < 0.08) continue;
    let alpha = map(abs(osc), 0, max(abs(displacement) * 0.8, 0.5), 2, 35);
    if (osc > 0) fill(220, 40, 40, alpha);
    else fill(40, 60, 220, alpha);
    rect(GX + c * CELL - 1, GY - 8, CELL + 1, ROWS * CELL + 16);
  }

  // ── Grid lines ──
  stroke(255, 255, 255, 5);
  strokeWeight(0.5);
  for (let c = 0; c <= COLS; c++) line(GX + c * CELL, GY - 8, GX + c * CELL, GY + ROWS * CELL + 8);
  for (let r = 0; r <= ROWS; r++) line(GX, GY + r * CELL, GX + COLS * CELL, GY + r * CELL);
  noStroke();

  // ── Particles ──
  let speed = 8, atten = 0.93;
  for (let p of particles) {
    let delay = p.c / speed;
    let amp = displacement * pow(atten, max(0, p.c - 2));
    let osc = amp * sin(frameCount * 0.1 + p.ph - delay * 1.2);
    p.x = p.bx + osc;

    let c;
    let a = abs(osc);
    if (a < 0.08) c = color(100, 100, 120, 50);
    else if (osc > 0) {
      let r = map(a, 0, max(abs(displacement) * 0.8, 0.5), 180, 255);
      c = color(r, 40, 50, 230);
    } else {
      let b = map(a, 0, max(abs(displacement) * 0.8, 0.5), 120, 255);
      c = color(40, 60, b, 230);
    }
    fill(c);
    ellipse(p.x, p.y, 12, 12);
  }

  // ── Source ──
  let sh = ROWS * CELL;
  // Speaker cone shape
  fill(80, 50, 20);
  rect(sourceX - 12, GY - 10, 24, sh + 20, 4);
  fill(240, 180, 50);
  rect(sourceX - 4, GY - 2, 8, sh + 4, 2);
  // Arrow showing it pushes/pulls
  if (displacement > 2) {
    stroke(255, 200, 50, 150);
    strokeWeight(2);
    line(sourceX + 6, GY + sh / 2, sourceX + 18, GY + sh / 2);
    line(sourceX + 18, GY + sh / 2, sourceX + 13, GY + sh / 2 - 5);
    line(sourceX + 18, GY + sh / 2, sourceX + 13, GY + sh / 2 + 5);
    noStroke();
  } else if (displacement < -2) {
    stroke(255, 200, 50, 150);
    strokeWeight(2);
    line(sourceX - 6, GY + sh / 2, sourceX - 18, GY + sh / 2);
    line(sourceX - 18, GY + sh / 2, sourceX - 13, GY + sh / 2 - 5);
    line(sourceX - 18, GY + sh / 2, sourceX - 13, GY + sh / 2 + 5);
    noStroke();
  }

  // ── Cam preview ──
  if (showCam && video && camReady) {
    push();
    translate(GX + COLS * CELL + 30, GY);
    scale(-0.25, 0.25);
    image(video, 0, 0);
    pop();
  }

  // ── Labels ──
  if (showLabels) {
    noStroke();
    textAlign(CENTER, TOP);
    // Title
    textSize(22);
    fill(255, 200, 80);
    text('ONDAS DE SONIDO EN EL AIRE', GX + COLS * CELL / 2, 30);

    // Legend inline
    textSize(13);
    fill(255, 100, 100);
    text('🔴 Compresión — partículas juntas, presión ↑', GX + COLS * CELL / 2, 62);
    fill(100, 140, 255);
    text('🔵 Rarefacción — partículas separadas, presión ↓', GX + COLS * CELL / 2, 82);
    fill(200, 200, 200);
    textSize(12);
    text('← La fuente (altavoz/mano) empuja y jala el aire →', GX + COLS * CELL / 2, 105);

    // At source
    fill(240, 180, 50);
    textSize(11);
    text('Fuente\nvibrante', sourceX, GY - 18);

    // Arrows above compression/rarefaction zones
    let rightEdge = GX + COLS * CELL;

    // Bottom arrow
    let arrowY = GY + ROWS * CELL + 28;
    stroke(255, 255, 255, 80);
    strokeWeight(1.5);
    line(GX, arrowY, rightEdge, arrowY);
    line(rightEdge, arrowY, rightEdge - 12, arrowY - 5);
    line(rightEdge, arrowY, rightEdge - 12, arrowY + 5);
    noStroke();
    fill(255, 255, 255, 160);
    textSize(12);
    text('Dirección de propagación de la onda →', GX + COLS * CELL / 2, arrowY + 8);

    textSize(10);
    fill(200, 200, 200, 120);
    text('Las partículas solo vibran en su lugar, NO viajan con la onda', GX + COLS * CELL / 2, arrowY + 26);
  }

  // ── Mouse tracker line ──
  if (mouseOn) {
    stroke(255, 255, 255, 60);
    strokeWeight(1);
    line(mouseX, GY - 20, mouseX, GY + ROWS * CELL + 20);
    noStroke();
  }
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>
</body>
</html>
