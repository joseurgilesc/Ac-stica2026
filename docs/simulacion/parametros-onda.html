<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parámetros de una onda sinusoidal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #f5f5f0; font-family: Georgia, serif; }
    canvas { display: block; }
    #panel {
      position: absolute; top: 0; left: 0; width: 210px; height: 100vh;
      background: rgba(36, 157, 143, 0.04); color: #1a1a1a; padding: 12px;
      font-size: 11px; z-index: 5; overflow-y: auto;
      border-right: 1px solid rgba(36, 157, 143, 0.15);
    }
    #panel h3 { margin: 0 0 6px; font-size: 13px; color: #1A7A6F; }
    #panel label { display: block; margin: 6px 0 2px; color: #333; font-size: 10px; }
    #panel .val { font-weight: bold; color: #1A7A6F; }
    #panel input[type=range] { width: 100%; accent-color: #249D8F; margin: 3px 0; }
    #panel button { width: 100%; margin: 3px 0; padding: 5px 8px; border: 1px solid rgba(36,157,143,0.3); border-radius: 3px; cursor: pointer; background: rgba(36,157,143,0.05); font-size: 11px; font-family: Georgia, serif; }
    #panel button:hover { background: rgba(36,157,143,0.12); }
    #panel .section { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(36,157,143,0.12); }
    #panel .info { padding: 6px 8px; margin: 4px 0; background: rgba(36,157,143,0.06); border-radius: 4px; font-size: 10px; }
  </style>
</head>
<body>

<div id="panel">
  <h3>y(t) = A · sin(2π f t + φ)</h3>
  <div class="section">
    <label>Amplitud (A): <input type="number" id="amp-num" value="20" min="5" max="60" step="1" style="width:55px;padding:2px;border:1px solid #ccc;border-radius:3px;font-size:11px"> m</label>
    <input type="range" id="amp" min="5" max="60" value="20" step="1">
  </div>
  <div class="section">
    <label>Frecuencia (f): <input type="number" id="freq-num" value="1" min="0.3" max="5" step="0.1" style="width:55px;padding:2px;border:1px solid #ccc;border-radius:3px;font-size:11px"> Hz</label>
    <input type="range" id="freq" min="0.3" max="5" value="1" step="0.1">
  </div>
  <div class="section">
    <label>Fase (φ): <input type="number" id="phase-num" value="0" min="0" max="360" step="5" style="width:55px;padding:2px;border:1px solid #ccc;border-radius:3px;font-size:11px"> °</label>
    <input type="range" id="phase" min="0" max="360" value="0" step="5">
  </div>
  <div class="section">
    <button id="btn-pause">⏯ Pausar</button>
    <button id="btn-reset">🔄 Valores iniciales</button>
  </div>
  <div class="section">
    <div class="info"><b>T</b> = 1/f = <span id="tv">1.00 s</span></div>
    <div class="info"><b>λ</b> = v/f = <span id="lv">344 m</span></div>
  </div>
</div>

<script>
let amplitude = 20, frequency = 1, phase = 0;
let time = 0, vSound = 344, paused = false;

function setup() {
  createCanvas(windowWidth, windowHeight);
  textFont('Georgia');

  let as = select('#amp'), fs = select('#freq'), ps = select('#phase');
  let an = select('#amp-num'), fn = select('#freq-num'), pn = select('#phase-num');

  function setAmp(v) {
    amplitude = v;
    as.elt.value = v;
    an.elt.value = v;
    updateInfo();
  }
  function setFreq(v) {
    frequency = v;
    fs.elt.value = v;
    fn.elt.value = v;
    updateInfo();
  }
  function setPhase(v) {
    phase = v;
    ps.elt.value = v;
    pn.elt.value = v;
  }

  as.input(() => setAmp(parseFloat(as.value())));
  an.input(() => { let v = parseFloat(an.value()); if (!isNaN(v)) setAmp(constrain(v, 5, 60)); });
  fs.input(() => setFreq(parseFloat(fs.value())));
  fn.input(() => { let v = parseFloat(fn.value()); if (!isNaN(v)) setFreq(constrain(v, 0.3, 5)); });
  ps.input(() => setPhase(parseFloat(ps.value())));
  pn.input(() => { let v = parseFloat(pn.value()); if (!isNaN(v)) setPhase(constrain(v, 0, 360)); });
  select('#btn-reset').mousePressed(() => {
    setAmp(20); setFreq(1); setPhase(0);
    updateInfo();
  });
  select('#btn-pause').mousePressed(() => {
    paused = !paused;
    select('#btn-pause').html(paused ? '\u25B6 Reanudar' : '\u23EF Pausar');
  });
  updateInfo();
}

function updateInfo() {
  let T = 1 / frequency;
  let lambda = vSound / frequency;
  select('#tv').html(T.toFixed(3) + ' s');
  select('#lv').html(lambda.toFixed(1) + ' m');
}

function draw() {
  background(245, 245, 240);

  if (!paused) time += deltaTime * 0.001;

  let GX = 230, GW = width - GX - 30;
  let CY = height * 0.52;
  let maxAmp = map(amplitude, 5, 60, 25, 220);
  let phaseRad = radians(phase);

  // ── Amplitude zone ──
  stroke(36, 157, 143, 40);
  strokeWeight(1.5);
  line(GX - 10, CY - maxAmp, GX + GW, CY - maxAmp);
  line(GX - 10, CY + maxAmp, GX + GW, CY + maxAmp);

  // Amplitude arrows
  stroke(36, 157, 143, 80);
  strokeWeight(1);
  line(GX - 25, CY, GX - 25, CY - maxAmp);
  line(GX - 25, CY, GX - 25, CY + maxAmp);
  line(GX - 30, CY - maxAmp + 8, GX - 25, CY - maxAmp);
  line(GX - 20, CY - maxAmp + 8, GX - 25, CY - maxAmp);
  line(GX - 30, CY + maxAmp - 8, GX - 25, CY + maxAmp);
  line(GX - 20, CY + maxAmp - 8, GX - 25, CY + maxAmp);

  noStroke();
  fill(26, 122, 111, 140);
  textSize(11);
  textAlign(RIGHT, CENTER);
  text('A = ' + amplitude + ' m', GX - 35, CY);
  text('0', GX - 10, CY);

  // ── Zero line ──
  stroke(36, 157, 143, 60);
  strokeWeight(1.5);
  line(GX, CY, GX + GW, CY);
  noStroke();

  // ── Wave curve ──
  stroke(36, 157, 143);
  strokeWeight(3);
  noFill();
  beginShape();
  for (let i = 0; i <= 400; i++) {
    let x = GX + (i / 400) * GW;
    // At x=GX (pos=0), phase=0, t=0: sin(0)=0, going UP
    // Positive phase shifts wave to the RIGHT (easier to see)
    let val = sin((i / 400) * TWO_PI * frequency - time * 2 - phaseRad);
    vertex(x, CY - val * maxAmp);
  }
  endShape();

  // ── Phase visualization (visible when paused or at low speed) ──
  if (phase > 0) {
    let lamPx = GW / frequency;
    // Find zero crossings by scanning a few points
    let crossings = [];
    let steps = Math.floor(GW);
    let prevVal = null;
    for (let i = 0; i < steps; i++) {
      let x = GX + i;
      let u = (x - GX) / GW;
      let val = sin(u * TWO_PI * frequency - time * 2 - phaseRad);
      if (prevVal !== null && prevVal < 0 && val >= 0) {
        crossings.push(x);
      }
      prevVal = val;
    }
    // Find the same for phase=0
    let refCrossings = [];
    prevVal = null;
    for (let i = 0; i < steps; i++) {
      let x = GX + i;
      let u = (x - GX) / GW;
      let val = sin(u * TWO_PI * frequency - time * 2);
      if (prevVal !== null && prevVal < 0 && val >= 0) {
        refCrossings.push(x);
      }
      prevVal = val;
    }

    if (crossings.length > 0 && refCrossings.length > 0) {
      let actualZeroX = crossings[0];
      let refZeroX = refCrossings[0];
      let shiftPx = actualZeroX - refZeroX;
      if (shiftPx < 0) shiftPx += lamPx;

      // Band
      fill(224, 90, 71, 12);
      noStroke();
      rect(refZeroX, CY - maxAmp, shiftPx, maxAmp * 2);

      // Reference line
      stroke(36, 157, 143, 70);
      strokeWeight(1);
      drawingContext.setLineDash([4, 4]);
      line(refZeroX, CY - maxAmp - 5, refZeroX, CY + maxAmp + 5);
      drawingContext.setLineDash([]);

      // Phase line
      stroke(224, 90, 71, 180);
      strokeWeight(2);
      line(actualZeroX, CY - maxAmp - 5, actualZeroX, CY + maxAmp + 5);

      // Arrow
      let arrowY = CY - maxAmp - 22;
      stroke(224, 90, 71, 180);
      strokeWeight(1.5);
      line(refZeroX, arrowY, actualZeroX, arrowY);
      line(actualZeroX, arrowY, actualZeroX - 8, arrowY - 5);
      line(actualZeroX, arrowY, actualZeroX - 8, arrowY + 5);

      noStroke();
      fill(224, 90, 71);
      textSize(10);
      textAlign(CENTER, BOTTOM);
      text('\u03C6 = ' + phase + '\u00B0', refZeroX + shiftPx / 2, arrowY - 4);
    }
  }

  // Circle indicator
  let cx = GX + GW - 80, cr = 30;
  stroke(224, 90, 71, 80);
  strokeWeight(1);
  noFill();
  circle(cx, 60, cr * 2);

  let dotAngle = -radians(phase) + PI / 2;
  let dx = cx + cos(dotAngle) * cr;
  let dy = 60 - sin(dotAngle) * cr;
  fill(224, 90, 71);
  noStroke();
  circle(dx, dy, 6);

  stroke(36, 157, 143, 40);
  strokeWeight(0.5);
  line(cx - cr, 60, cx + cr, 60);
  line(cx, 60 - cr, cx, 60 + cr);

  noStroke();
  fill(224, 90, 71, 120);
  textSize(10);
  textAlign(LEFT, CENTER);
  text('\u03C6', cx + cr + 8, dy);

  // ── Wavelength marker ──
  lamPx = GW / frequency;
  if (lamPx < GW * 0.85 && lamPx > 50) {
    let lx = GX + 5;
    let ly = CY + maxAmp + 35;
    stroke(255, 180, 40, 150);
    strokeWeight(2);
    line(lx, ly, lx + lamPx, ly);
    line(lx, ly - 7, lx, ly + 7);
    line(lx + lamPx, ly - 7, lx + lamPx, ly + 7);
    noStroke();
    fill(255, 180, 40);
    textSize(12);
    textAlign(CENTER, TOP);
    text('λ = ' + (vSound/frequency).toFixed(1) + ' m', lx + lamPx / 2, ly + 8);
  }

  // ── Period marker ──
  let periodPx = GW / frequency;
  if (periodPx < GW * 0.85) {
    let px = GX + 5;
    let py = CY - maxAmp - 38;
    stroke(100, 160, 255, 150);
    strokeWeight(2);
    line(px, py, px + periodPx, py);
    line(px, py - 7, px, py + 7);
    line(px + periodPx, py - 7, px + periodPx, py + 7);
    noStroke();
    fill(100, 160, 255);
    textSize(11);
    textAlign(CENTER, BOTTOM);
    text('T = ' + (1/frequency).toFixed(3) + ' s', px + periodPx / 2, py - 8);
  }

  // ── Title ──
  noStroke();
  fill(26, 122, 111);
  textSize(15);
  textAlign(CENTER, TOP);
  text('Desplazamiento: y(t) = ' + amplitude + ' \u00B7 sin(2\u03C0\u00B7' + frequency.toFixed(1) + '\u00B7t + ' + phase + '\u00B0)', GX + GW / 2, 20);

  textSize(10);
  fill(120);
  text('Amplitud en metros (m) | T = ' + (1/frequency).toFixed(2) + ' s | λ = ' + (vSound/frequency).toFixed(1) + ' m | v = ' + vSound + ' m/s', GX + GW / 2, 42);

  // Legend
  textAlign(LEFT, TOP);
  textSize(10);
  fill(255, 180, 40);
  text('🟡 λ — longitud de onda', width - 200, 76);
  fill(100, 160, 255);
  text('🔵 T — período', width - 200, 91);
  fill(224, 90, 71);
  text('🔴 φ — fase', width - 200, 106);

  // Play/pause indicator
  if (paused) {
    fill(224, 90, 71);
    textSize(13);
    textAlign(RIGHT, TOP);
    text('\u23F8 PAUSADO', GX + GW, 20);
  }
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>
</body>
</html>
