<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movimiento Armónico Simple — Trazado de onda sinusoidal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #f5f5f0; font-family: Georgia, serif; }
    canvas { display: block; }
    #panel {
      position: absolute; top: 0; left: 0; width: 200px; height: 100vh;
      background: rgba(36, 157, 143, 0.04); color: #1a1a1a; padding: 12px;
      font-size: 11px; z-index: 5; overflow-y: auto;
      border-right: 1px solid rgba(36, 157, 143, 0.15);
    }
    #panel h3 { margin: 0 0 6px; font-size: 13px; color: #1A7A6F; }
    #panel button { width: 100%; margin: 3px 0; padding: 5px 8px; border: 1px solid rgba(36, 157, 143, 0.3); border-radius: 3px; cursor: pointer; background: rgba(36, 157, 143, 0.05); font-size: 11px; font-family: Georgia, serif; }
    #panel button:hover { background: rgba(36, 157, 143, 0.12); }
    #panel input[type=range] { width: 100%; accent-color: #249D8F; margin: 3px 0; }
    #panel label { display: block; margin: 6px 0 2px; color: #333; font-size: 10px; }
    #panel .val { font-weight: bold; color: #1A7A6F; }
    #panel .section { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(36,157,143,0.12); }
    #panel .info { font-size: 10px; color: #555; line-height: 1.5; margin-top: 10px; }
  </style>
</head>
<body>

<div id="panel">
  <h3>Movimiento Armónico Simple</h3>
  <div class="section">
    <label>Rigidez del resorte: <span class="val" id="kv">media</span></label>
    <input type="range" id="stiffness" min="0.3" max="2.0" step="0.1" value="1.0">
  </div>
  <div class="section">
    <label>Amplitud inicial: <span class="val" id="av">1.0</span></label>
    <input type="range" id="amplitude" min="0.3" max="1.5" step="0.1" value="1.0">
  </div>
  <div class="section">
    <label>Velocidad del papel: <span class="val" id="sv">1.0</span></label>
    <input type="range" id="speed" min="0.5" max="2.5" step="0.1" value="1.0">
  </div>
  <div class="section">
    <button id="btn-reset">🔄 Reiniciar</button>
    <button id="btn-pause">⏯ Pausar</button>
  </div>
  <div class="info">
    <b>Figura 1-1 y 1-2 del Everest</b><br>
    Una masa sujeta a un resorte oscila con movimiento armónico simple. Un lápiz traza una onda sinusoidal sobre una tira de papel que se mueve a velocidad constante.
  </div>
</div>

<script>
let stiffness = 1.0, amplitude = 1.0, paperSpeed = 1.0;
let position = 0, velocity = 0;  // mass position & velocity
let paused = false;
let wavePoints = [];
let maxPoints = 800;

function setup() {
  createCanvas(windowWidth, windowHeight);
  textFont('Georgia');

  // Initial displacement
  position = 0.8 * amplitude;
  velocity = 0;

  let st = select('#stiffness'), am = select('#amplitude'), sp = select('#speed');
  st.input(() => { stiffness = parseFloat(st.value()); select('#kv').html(stiffness < 0.7 ? 'baja' : stiffness < 1.3 ? 'media' : 'alta'); });
  am.input(() => { amplitude = parseFloat(am.value()); select('#av').html(amplitude.toFixed(1)); });
  sp.input(() => { paperSpeed = parseFloat(sp.value()); select('#sv').html(paperSpeed.toFixed(1)); });
  select('#btn-reset').mousePressed(() => { position = 0.8 * amplitude; velocity = 0; wavePoints = []; });
  select('#btn-pause').mousePressed(() => { paused = !paused; select('#btn-pause').html(paused ? '▶ Reanudar' : '⏯ Pausar'); });
}

function draw() {
  background(245, 245, 240);

  let GX = 220;
  let GW = width - GX - 30;
  let springTop = 60;
  let springBottom = 280;
  let massCenter = 330;
  let paperY = 400;
  let paperH = 180;

  // ── Physics update ──
  if (!paused) {
    let dt = 0.016;
    let omega = TWO_PI * stiffness;  // angular frequency
    let k = omega * omega;
    let damping = 0.002;
    let accel = -k * position - damping * velocity;
    velocity += accel * dt;
    position += velocity * dt;
  }

  let massY = massCenter + position * 60 * amplitude;
  let penX = GX + GW * 0.6;
  let penY = massY;  // pen is attached to mass

  // ── Record wave ──
  if (!paused && wavePoints.length < maxPoints) {
    if (wavePoints.length === 0 || frameCount % 2 === 0) {
      wavePoints.push({ y: massY });
    }
  }

  // Shift wave points left (paper moving)
  if (!paused && wavePoints.length > 0) {
    let shift = paperSpeed * 1.2;
    for (let p of wavePoints) p.y = lerp(p.y, massY, 0.03);
  }

  // Remove old points
  while (wavePoints.length > maxPoints) wavePoints.shift();

  // ═══ Draw fixed support ═══
  stroke(36, 157, 143);
  strokeWeight(3);
  line(penX - 60, springTop, penX + 60, springTop);

  // Support bracket lines
  strokeWeight(1.5);
  for (let i = 0; i < 8; i++) {
    let sx = penX - 30 + i * 8;
    line(sx, springTop, sx - 4, springTop - 18);
  }

  // ═══ Draw spring ═══
  let springLen = massY - springTop;
  let coils = 12;
  let coilWidth = 14;
  noFill();
  stroke(36, 157, 143);
  strokeWeight(2);
  beginShape();
  for (let i = 0; i <= coils * 2; i++) {
    let ty = springTop + (i / (coils * 2)) * springLen;
    let tx = penX + (i % 2 === 0 ? -coilWidth : coilWidth);
    vertex(tx, ty);
  }
  endShape();

  // ═══ Draw mass (weight) ═══
  let massW = 60, massH = 50;
  fill(255);
  stroke(36, 157, 143);
  strokeWeight(2);
  rectMode(CENTER);
  rect(penX, massY + massH / 2, massW, massH, 4);
  rectMode(CORNER);

  // Weight label
  noStroke();
  fill(26, 122, 111);
  textAlign(CENTER, CENTER);
  textSize(18);
  text('W', penX, massY + massH / 2);

  // Connection ring
  stroke(36, 157, 143);
  strokeWeight(2);
  noFill();
  circle(penX, massY, 16);
  circle(penX, massY, 8);

  // ═══ Draw connecting arm from mass to pen tip ═══
  stroke(36, 157, 143, 150);
  strokeWeight(2);
  let armY = massY - 10;
  line(penX, armY, penX - 80, paperY - 20);

  // ═══ Draw pen ═══
  let penTipX = penX - 80;
  let penTipY = paperY - 20;
  fill(26, 122, 111);
  noStroke();
  triangle(penTipX, penTipY - 14, penTipX, penTipY + 2, penTipX - 10, penTipY - 6);

  // ═══ Draw paper strip ═══
  fill(255);
  stroke(150, 150, 150);
  strokeWeight(1);
  rect(GX, paperY - 60, GW - 60, paperH);

  // Paper edge
  stroke(100);
  strokeWeight(1);
  line(GX, paperY + paperH - 60, GX + GW - 60, paperY + paperH - 60);

  // ═══ Draw traced sine wave on paper ═══
  noFill();
  stroke(36, 157, 143);
  strokeWeight(2.5);

  let pointWidth = (GW - 60) / maxPoints;
  beginShape();
  for (let i = 0; i < wavePoints.length; i++) {
    let wx = penX - 80 - (wavePoints.length - i) * pointWidth * paperSpeed;
    let wy = paperY - 20;
    // The wave is traced at the pen tip position
    if (i === wavePoints.length - 1) {
      vertex(penTipX, penTipY);
    } else {
      // Map mass Y position to paper
      let mappedY = map(wavePoints[i].y, massCenter - 60, massCenter + 60, paperY - 50, paperY + 50);
      vertex(wx, mappedY);
    }
  }
  endShape();

  // ═══ Paper motion arrow ═══
  stroke(36, 157, 143, 180);
  strokeWeight(1.5);
  let arrY = paperY + paperH - 30;
  line(GX + 80, arrY, GX + 20, arrY);
  line(GX + 20, arrY, GX + 32, arrY - 6);
  line(GX + 20, arrY, GX + 32, arrY + 6);
  noStroke();
  fill(26, 122, 111);
  textAlign(LEFT, CENTER);
  textSize(13);
  text('Movimiento del papel', GX + 90, arrY);

  // ═══ Time arrow ═══
  stroke(36, 157, 143, 180);
  strokeWeight(1.5);
  let tax = penX - 80, tay = paperY + paperH - 10;
  line(tax - 100, tay, tax - 20, tay);
  line(tax - 20, tay, tax - 32, tay - 6);
  line(tax - 20, tay, tax - 32, tay + 6);
  noStroke();
  fill(26, 122, 111);
  textSize(12);
  text('Tiempo', tax - 130, tay);

  // ═══ Equilibrium line ═══
  stroke(36, 157, 143, 50);
  strokeWeight(1);
  setLineDash([4, 6]);
  line(penX - 60, massCenter, penX + 60, massCenter);
  setLineDash([]);

  // ═══ Labels ═══
  noStroke();
  fill(26, 122, 111);
  textAlign(CENTER, TOP);
  textSize(15);
  text('Figura 1-2: Movimiento armónico simple trazado como onda sinusoidal', width / 2, 12);

  textSize(11);
  fill(100);
  text('Elasticidad del resorte + inercia de la masa → oscilación sinusoidal. El lápiz traza la onda sobre el papel en movimiento.', width / 2, 32);
}

function setLineDash(list) { drawingContext.setLineDash(list); }
function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>
</body>
</html>
