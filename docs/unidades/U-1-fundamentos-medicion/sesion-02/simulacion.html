<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulación de Onda Sonora - Sesión 2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  :root {
    --teal: #249D8F;
    --teal-dark: #1A7A6F;
    --teal-light: #5BC0B3;
    --bg: #0F1923;
    --surface: #162231;
    --text: #E0E6ED;
    --text-dim: #8899AA;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); }
  canvas { display: block; border-radius: 12px; border: 2px solid var(--teal); }
  .container { max-width: 820px; width: 100%; padding: 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 12px 8px; }
  .control-group { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 90px; background: var(--surface); border-radius: 10px; padding: 8px 12px; border: 1px solid rgba(36,157,143,0.3); }
  .control-group label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.8px; }
  .control-group .value { font-size: 16px; font-weight: 700; color: var(--teal-light); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100px; accent-color: var(--teal); }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 4px 8px 10px; }
  .toggle-btn { padding: 5px 12px; border-radius: 16px; border: 1px solid rgba(36,157,143,0.4); background: var(--surface); color: var(--text-dim); cursor: pointer; font-size: 11px; transition: all 0.2s; }
  .toggle-btn.active { background: var(--teal); color: #fff; border-color: var(--teal); }
  .toggle-btn:hover { border-color: var(--teal-light); }
  .info { color: var(--text-dim); font-size: 10px; text-align: center; padding: 2px 8px 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 4px 8px; font-size: 10px; color: var(--text-dim); }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
</style>
</head>
<body>
<div class="container">
  <div class="controls">
    <div class="control-group">
      <label>Amplitud</label>
      <span class="value" id="ampVal">100</span>
      <input type="range" id="ampSlider" min="10" max="160" value="100" step="1">
    </div>
    <div class="control-group">
      <label>Frecuencia</label>
      <span class="value" id="freqVal">2</span>
      <input type="range" id="freqSlider" min="1" max="8" value="2" step="0.5">
    </div>
    <div class="control-group">
      <label>Fase (°)</label>
      <span class="value" id="phaseVal">0</span>
      <input type="range" id="phaseSlider" min="0" max="360" value="0" step="15">
    </div>
    <div class="control-group">
      <label>Velocidad</label>
      <span class="value" id="speedVal">1x</span>
      <input type="range" id="speedSlider" min="0" max="3" value="1" step="0.25">
    </div>
  </div>

  <div class="toggles">
    <button class="toggle-btn active" data-layer="displacement">Desplazamiento</button>
    <button class="toggle-btn active" data-layer="pressure">Presión</button>
    <button class="toggle-btn active" data-layer="particles">Partículas</button>
    <button class="toggle-btn active" data-layer="density">Densidad</button>
  </div>

  <div id="canvasContainer"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#249D8F"></div> Desplazamiento</div>
    <div class="legend-item"><div class="legend-dot" style="background:#E87461"></div> Presión</div>
    <div class="legend-item"><div class="legend-dot" style="background:#F4B860"></div> Compresión</div>
    <div class="legend-item"><div class="legend-dot" style="background:#5BC0B3"></div> Rarefacción</div>
  </div>

  <div class="info">Modifica los parámetros y activa/desactiva capas para analizar cada fenómeno por separado</div>
</div>

<script>
let amplitude = 100;
let baseFreq = 2;
let phaseOffset = 0;
let animSpeed = 1;
let time = 0;

let showDisplacement = true;
let showPressure = true;
let showParticles = true;
let showDensity = true;

// Teal palette
const TEAL = '#249D8F';
const TEAL_LIGHT = '#5BC0B3';
const TEAL_DARK = '#1A7A6F';
const BORDER_TEAL = 'rgba(36,157,143,0.4)';
const GRID_COLOR = 'rgba(36,157,143,0.12)';

function setup() {
  let cnv = createCanvas(790, 380);
  cnv.parent('canvasContainer');

  document.getElementById('ampSlider').addEventListener('input', function() {
    amplitude = parseInt(this.value);
    document.getElementById('ampVal').textContent = amplitude;
  });
  document.getElementById('freqSlider').addEventListener('input', function() {
    baseFreq = parseFloat(this.value);
    document.getElementById('freqVal').textContent = baseFreq.toFixed(1);
  });
  document.getElementById('phaseSlider').addEventListener('input', function() {
    phaseOffset = radians(parseInt(this.value));
    document.getElementById('phaseVal').textContent = this.value;
  });
  document.getElementById('speedSlider').addEventListener('input', function() {
    animSpeed = parseFloat(this.value);
    document.getElementById('speedVal').textContent = animSpeed === 0 ? 'Pausa' : animSpeed.toFixed(2) + 'x';
  });

  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      this.classList.toggle('active');
      let layer = this.dataset.layer;
      if (layer === 'displacement') showDisplacement = this.classList.contains('active');
      if (layer === 'pressure') showPressure = this.classList.contains('active');
      if (layer === 'particles') showParticles = this.classList.contains('active');
      if (layer === 'density') showDensity = this.classList.contains('active');
    });
  });
}

function draw() {
  background(15, 25, 35);

  if (animSpeed > 0) {
    time += 0.016 * animSpeed;
  }

  let centerY = height / 2;

  // Grid
  stroke(GRID_COLOR);
  strokeWeight(1);
  for (let x = 0; x < width; x += 50) {
    line(x, 0, x, height);
  }
  line(0, centerY, width, centerY);

  // Axis labels
  noStroke();
  fill(100, 120, 140);
  textSize(11);
  textAlign(CENTER);
  text('Tiempo →', width - 35, centerY - 10);
  textAlign(LEFT, CENTER);
  text('⟳ Desplazamiento', 6, 16);

  let numParticles = 48;
  let spacing = (width - 80) / numParticles;

  // Density zones
  if (showDensity) {
    for (let i = 0; i <= numParticles; i++) {
      let x = 40 + i * spacing;
      let angle = (i / numParticles) * TWO_PI * baseFreq - time * TWO_PI + phaseOffset;
      let density = cos(angle);
      if (abs(density) > 0.2) {
        let alpha = abs(density) * 30;
        if (density > 0) {
          fill(244, 184, 96, alpha); // warm compression
        } else {
          fill(91, 192, 179, alpha); // cool rarefaction
        }
        noStroke();
        rect(x - spacing/2, 6, spacing, height - 12);
      }
    }
  }

  // Displacement wave
  if (showDisplacement) {
    noFill();
    strokeWeight(2.5);
    stroke(TEAL);
    beginShape();
    for (let i = 0; i <= numParticles; i++) {
      let x = 40 + i * spacing;
      let angle = (i / numParticles) * TWO_PI * baseFreq - time * TWO_PI + phaseOffset;
      let y = centerY + sin(angle) * amplitude;
      vertex(x, y);
    }
    endShape();
  }

  // Pressure wave
  if (showPressure) {
    noFill();
    strokeWeight(1.8);
    stroke(232, 116, 97, 180);
    drawingContext.setLineDash([5, 5]);
    beginShape();
    for (let i = 0; i <= numParticles; i++) {
      let x = 40 + i * spacing;
      let angle = (i / numParticles) * TWO_PI * baseFreq - time * TWO_PI + phaseOffset;
      let y = centerY + cos(angle) * amplitude;
      vertex(x, y);
    }
    endShape();
    drawingContext.setLineDash([]);
  }

  // Particles
  if (showParticles) {
    noStroke();
    for (let i = 0; i <= numParticles; i++) {
      let x = 40 + i * spacing;
      let angle = (i / numParticles) * TWO_PI * baseFreq - time * TWO_PI + phaseOffset;
      let y = centerY + sin(angle) * amplitude;
      let density = cos(angle);

      if (density > 0.25) {
        fill(244, 184, 96, 220);
      } else if (density < -0.25) {
        fill(91, 192, 179, 220);
      } else {
        fill(150, 160, 175, 130);
      }

      let r = 4 + density * 1.8;
      ellipse(x, y, r, r);
    }
  }

  // Status bar
  noStroke();
  fill(120, 140, 155);
  textAlign(RIGHT);
  textSize(10);
  text(`f = ${baseFreq.toFixed(1)} ciclos | A = ${amplitude} px | φ = ${degrees(phaseOffset).toFixed(0)}°`, width - 10, height - 8);
}
</script>
</body>
</html>
