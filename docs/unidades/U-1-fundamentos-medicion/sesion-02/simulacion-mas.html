<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movimiento Armónico Simple → Onda Sinusoidal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  :root { --teal: #249D8F; --teal-dark: #1A7A6F; --bg: #0F1923; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; display: flex; justify-content: center; background: var(--bg); }
  canvas { display: block; border-radius: 8px; }
</style>
</head>
<body>
<script>
let time = 0;
const TEAL = '#249D8F';
const TEAL_LIGHT = '#5BC0B3';
const CORAL = '#E87461';

function setup() {
  createCanvas(740, 280).parent(document.body);
}

function draw() {
  background(15, 25, 35);
  time += 0.025;

  let springX = 110;
  let springTop = 50;
  let springBase = 205;
  let massY = springBase + sin(time * 2) * 55;

  // LEFT: Mass-spring system
  stroke(180);
  strokeWeight(3);
  line(springX, 20, springX, springTop);
  fill(180); noStroke();
  triangle(springX-12, 20, springX+12, 20, springX, 8);

  // Spring zigzag
  stroke(TEAL_LIGHT);
  strokeWeight(2);
  noFill();
  beginShape();
  let segments = 14;
  for (let i = 0; i <= segments; i++) {
    let t = i / segments;
    let sy = springTop + (massY - springTop - 18) * t;
    let sx = springX + (i % 2 === 0 ? -10 : 10);
    vertex(sx, sy);
  }
  endShape();

  // Mass
  fill(TEAL);
  stroke(TEAL);
  strokeWeight(1);
  rect(springX-18, massY-2, 36, 22, 4);

  fill(180); noStroke();
  textAlign(CENTER);
  textSize(11);
  text('Masa + Resorte', springX, 20);
  text('MAS', springX, massY + 32);

  // Equilibrium line
  stroke(100, 100, 120, 100);
  strokeWeight(1);
  drawingContext.setLineDash([3, 5]);
  line(springX-30, springBase, springX+30, springBase);
  drawingContext.setLineDash([]);

  // RIGHT: Traveling wave
  let waveStartX = 200;
  let waveEndX = width - 20;
  let waveY = height / 2;

  // Axis
  stroke(60, 70, 85);
  strokeWeight(1);
  line(waveStartX, waveY, waveEndX, waveY);

  // Grid
  for (let x = waveStartX; x < waveEndX; x += 80) {
    stroke(40, 50, 65, 80);
    line(x, waveY-80, x, waveY+80);
  }

  // Traveling wave — se desplaza con el tiempo
  noFill();
  strokeWeight(2.5);
  stroke(TEAL);
  beginShape();
  for (let x = waveStartX; x <= waveEndX; x += 2) {
    let phase = map(x, waveStartX, waveEndX, 0, TWO_PI * 2.0);
    let y = waveY + sin(phase - time * 2) * 55;
    vertex(x, y);
  }
  endShape();

  // Connector line from mass to current wave position at x=waveStartX
  let connY = waveY + sin(-time * 2) * 55;
  stroke(CORAL, 120);
  strokeWeight(1.5);
  drawingContext.setLineDash([3, 4]);
  line(springX+18, massY, waveStartX, connY);
  drawingContext.setLineDash([]);

  // Dot at connection point
  fill(CORAL);
  noStroke();
  ellipse(waveStartX, connY, 8, 8);

  // Labels
  fill(160); noStroke();
  textAlign(CENTER);
  textSize(12);
  text('Onda viajera', width - 80, waveY-68);

  // Arrow showing travel direction
  stroke(TEAL, 120);
  strokeWeight(1.5);
  let arrowX = waveStartX + 180;
  let arrowY = waveY - 70;
  line(arrowX-20, arrowY, arrowX+20, arrowY);
  fill(TEAL, 120); noStroke();
  triangle(arrowX+20, arrowY, arrowX+14, arrowY-5, arrowX+14, arrowY+5);
  fill(TEAL, 160);
  textSize(10);
  text('Propagación →', arrowX, arrowY - 12);

  // Title
  fill(200);
  textAlign(CENTER);
  textSize(14);
  text('Movimiento Armónico Simple  →  Onda Sinusoidal viajera', width/2, height-14);
}
</script>
</body>
</html>
