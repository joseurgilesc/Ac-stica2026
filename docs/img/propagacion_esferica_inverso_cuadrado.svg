<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880"
     role="img" aria-labelledby="title description">
  <title id="title">Propagación esférica y ley del inverso del cuadrado</title>
  <desc id="description">Una fuente puntual distribuye la misma potencia acústica sobre áreas crecientes dentro de un ángulo sólido constante. El área aumenta con el cuadrado de la distancia y la intensidad disminuye en la misma proporción.</desc>
  <defs>
    <marker id="arrow-coral" markerWidth="11" markerHeight="11" refX="9" refY="5.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#E05B49"/>
    </marker>
    <radialGradient id="sourceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD76A" stop-opacity="1"/>
      <stop offset="45%" stop-color="#F5A623" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <pattern id="surfaceGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 0 H16 M0 0 V16" fill="none" stroke="#7AA9B6" stroke-width="1" opacity="0.72"/>
      <path d="M0 16 L16 0" fill="none" stroke="#B9D2D8" stroke-width="0.8" opacity="0.7"/>
    </pattern>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 31px; font-weight: 700; fill: #173B63; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 18px; fill: #5B7288; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 650; fill: #304A62; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 14px; fill: #5B7288; }
      .formula { font-family: Georgia, 'Times New Roman', serif; font-size: 23px; font-style: italic; fill: #E05B49; }
      .area { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-style: italic; fill: #173B63; }
      .table-head { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #173B63; }
      .table-text { font-family: Inter, Arial, sans-serif; font-size: 14px; fill: #415A70; }
      .wavefront { fill: none; stroke: #87A3B8; stroke-width: 2; }
      .cone { fill: none; stroke: #173B63; stroke-width: 2.2; stroke-linecap: round; }
      .radius { fill: none; stroke: #E05B49; stroke-width: 1.8; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1200" height="880" fill="#F7FAFC"/>
  <text x="64" y="55" class="title">Propagación esférica y ley del inverso del cuadrado</text>
  <text x="64" y="83" class="subtitle">La misma potencia sonora se distribuye sobre superficies cada vez mayores</text>
  <rect x="64" y="110" width="1072" height="650" rx="18" fill="#FFFFFF" stroke="#DDE6ED"/>

  <circle cx="400.0" cy="430.0" r="75.0" class="wavefront" stroke-width="2.0" opacity="0.72"/>
  <circle cx="400.0" cy="430.0" r="150.0" class="wavefront" stroke-width="2.0" opacity="0.72"/>
  <circle cx="400.0" cy="430.0" r="225.0" class="wavefront" stroke-width="2.0" opacity="0.72"/>
  <circle cx="400.0" cy="430.0" r="300.0" class="wavefront" stroke-width="2.5" opacity="0.9"/>
  <circle cx="400.0" cy="430.0" r="300.0" fill="#2373A6" opacity="0.018"/>
  <circle cx="400.0" cy="430.0" r="225.0" fill="#2373A6" opacity="0.023"/>
  <circle cx="400.0" cy="430.0" r="150.0" fill="#2373A6" opacity="0.03"/>
  <circle cx="400.0" cy="430.0" r="75.0" fill="#2373A6" opacity="0.04"/>
  <line x1="400.0" y1="430.0" x2="670.00" y2="338.28" class="cone" opacity="0.82"/>
  <line x1="400.0" y1="430.0" x2="730.00" y2="354.78" class="cone" opacity="0.82"/>
  <line x1="400.0" y1="430.0" x2="730.00" y2="538.22" class="cone" opacity="0.82"/>
  <line x1="400.0" y1="430.0" x2="670.00" y2="521.72" class="cone" opacity="0.82"/>
  <line x1="400.0" y1="430.0" x2="760" y2="430.0" stroke="#E05B49" stroke-width="2" marker-end="url(#arrow-coral)"/>
  <text x="510" y="348.0" class="small">dirección de propagación</text>
  <polygon points="467.50,407.07 482.50,411.20 482.50,457.05 467.50,452.93" fill="#DDF0F1" fill-opacity="0.76" stroke="#1C8B89" stroke-width="2.4"/>
  <polygon points="467.50,407.07 482.50,411.20 482.50,457.05 467.50,452.93" fill="url(#surfaceGrid)" stroke="none" opacity="0.8"/>
  <text x="475.00" y="389.07" text-anchor="middle" class="area">A1</text>
  <text x="475.00" y="487.93" text-anchor="middle" class="label">r</text>
  <text x="475.00" y="507.93" text-anchor="middle" class="small">área = 1A</text>
  <polygon points="535.00,384.14 565.00,392.39 565.00,484.11 535.00,475.86" fill="#DDF0F1" fill-opacity="0.76" stroke="#1C8B89" stroke-width="2.4"/>
  <polygon points="535.00,384.14 565.00,392.39 565.00,484.11 535.00,475.86" fill="url(#surfaceGrid)" stroke="none" opacity="0.8"/>
  <text x="550.00" y="366.14" text-anchor="middle" class="area">A2</text>
  <text x="550.00" y="510.86" text-anchor="middle" class="label">2r</text>
  <text x="550.00" y="530.86" text-anchor="middle" class="small">área = 4A</text>
  <polygon points="602.50,361.21 647.50,373.59 647.50,511.16 602.50,498.79" fill="#DDF0F1" fill-opacity="0.76" stroke="#1C8B89" stroke-width="2.4"/>
  <polygon points="602.50,361.21 647.50,373.59 647.50,511.16 602.50,498.79" fill="url(#surfaceGrid)" stroke="none" opacity="0.8"/>
  <text x="625.00" y="343.21" text-anchor="middle" class="area">A3</text>
  <text x="625.00" y="533.79" text-anchor="middle" class="label">3r</text>
  <text x="625.00" y="553.79" text-anchor="middle" class="small">área = 9A</text>
  <polygon points="670.00,338.28 730.00,354.78 730.00,538.22 670.00,521.72" fill="#DDF0F1" fill-opacity="0.76" stroke="#1C8B89" stroke-width="2.4"/>
  <polygon points="670.00,338.28 730.00,354.78 730.00,538.22 670.00,521.72" fill="url(#surfaceGrid)" stroke="none" opacity="0.8"/>
  <text x="700.00" y="320.28" text-anchor="middle" class="area">A4</text>
  <text x="700.00" y="556.72" text-anchor="middle" class="label">4r</text>
  <text x="700.00" y="576.72" text-anchor="middle" class="small">área = 16A</text>
  <circle cx="400.0" cy="430.0" r="30" fill="url(#sourceGlow)"/>
  <circle cx="400.0" cy="430.0" r="7" fill="#E05B49" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 390.0 440.0 L 318.0 493.0" stroke="#E05B49" stroke-width="1.6" fill="none"/>
  <text x="308.0" y="499.0" text-anchor="end" class="label">Fuente puntual</text>
  <rect x="820" y="190" width="282" height="386" rx="16" fill="#F8FBFD" stroke="#CEDBE5"/>
  <text x="847" y="226" class="label">Ángulo sólido constante Ω</text>
  <text x="961" y="267" text-anchor="middle" class="formula">A(r) = Ωr²</text>
  <text x="961" y="305" text-anchor="middle" class="formula">I(r) = P / Ωr²</text>
  <line x1="846" y1="327" x2="1076" y2="327" stroke="#D6E1E9"/>
  <text x="862" y="353" class="table-head">Distancia</text>
  <text x="955" y="353" class="table-head">Área</text>
  <text x="1022" y="353" class="table-head">Intensidad</text>
  <rect x="844" y="362" width="234" height="34" rx="7" fill="#EAF2F7"/>
  <text x="884" y="385" text-anchor="middle" class="table-text">r</text>
  <text x="966" y="385" text-anchor="middle" class="table-text">A</text>
  <text x="1036" y="385" text-anchor="middle" class="table-text">I₁</text>
  <text x="884" y="427" text-anchor="middle" class="table-text">2r</text>
  <text x="966" y="427" text-anchor="middle" class="table-text">4A</text>
  <text x="1036" y="427" text-anchor="middle" class="table-text">I₁ / 4</text>
  <rect x="844" y="446" width="234" height="34" rx="7" fill="#EAF2F7"/>
  <text x="884" y="469" text-anchor="middle" class="table-text">3r</text>
  <text x="966" y="469" text-anchor="middle" class="table-text">9A</text>
  <text x="1036" y="469" text-anchor="middle" class="table-text">I₁ / 9</text>
  <text x="884" y="511" text-anchor="middle" class="table-text">4r</text>
  <text x="966" y="511" text-anchor="middle" class="table-text">16A</text>
  <text x="1036" y="511" text-anchor="middle" class="table-text">I₁ / 16</text>
  <text x="961" y="550" text-anchor="middle" class="small">Duplicar la distancia:</text>
  <text x="961" y="572" text-anchor="middle" class="label">área ×4 · intensidad ÷4</text>
  <line x1="64" y1="795" x2="1136" y2="795" stroke="#D9E2EA" stroke-width="1.5"/>
  <text x="64" y="827" class="subtitle">Dentro del mismo ángulo sólido, el área interceptada crece proporcionalmente a r².</text>
  <text x="64" y="854" class="small">Por conservación de la potencia, la intensidad sonora es inversamente proporcional al cuadrado de la distancia.</text>
</svg>