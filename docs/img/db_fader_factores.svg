<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><style>.bg{fill:#f8fbfa}.track{fill:#ebf3f1}.dark{fill:#243238}.muted{fill:#64757f}.knob{fill:#fff;stroke:#249D8F;stroke-width:4}.title{font:700 34px system-ui,sans-serif}.h2{font:700 26px system-ui,sans-serif}.txt{font:20px system-ui,sans-serif}</style><rect class="bg" width="1200" height="560" rx="24"/><text x="60" y="60" class="title dark">El fader no crea sonido: multiplica la señal</text><rect x="160" y="120" width="120" height="340" rx="30" class="track"/><line x1="220" y1="150" x2="220" y2="430" stroke="#9eb8b2" stroke-width="8" stroke-linecap="round"/><circle cx="220" cy="180" r="28" class="knob"/><circle cx="220" cy="250" r="28" class="knob"/><circle cx="220" cy="320" r="28" class="knob"/><circle cx="220" cy="400" r="28" class="knob"/><text x="330" y="187" class="h2 dark">0 dB  →  ×1</text><text x="330" y="220" class="txt muted">Unity gain. La señal pasa intacta.</text><text x="330" y="257" class="h2 dark">−6 dB  →  ×0.5</text><text x="330" y="290" class="txt muted">La amplitud queda aproximadamente a la mitad.</text><text x="330" y="327" class="h2 dark">−12 dB → ×0.25</text><text x="330" y="360" class="txt muted">La amplitud queda aproximadamente en una cuarta parte.</text><text x="330" y="407" class="h2 dark">−∞ dB  →  ×0</text><text x="330" y="440" class="txt muted">Silencio: la señal queda anulada.</text><text x="60" y="505" class="txt dark">Fórmula útil:</text><text x="210" y="505" class="txt muted">factor = 10^(dB/20)</text></svg>