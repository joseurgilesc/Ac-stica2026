site_name: "Acústica Aplicada a la Producción Musical"
site_description: "Material de clase — Acústica Aplicada a la Producción Musical"
site_author: "José Urgilés"
repo_url: https://github.com/joseurgilesc/Ac-stica2026
repo_name: joseurgilesc/Ac-stica2026

theme:
  name: material
  language: es
  logo: img/logo.svg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Modo claro

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      lang: es

nav:
  - Inicio: index.md
  - Objetivos: objetivos.md
  - Logros de Aprendizaje: logros.md
  - Calendario: calendario.md
  - Bibliografía: bibliografia.md
  - "Unidad 1: Fundamentos del sonido y medición":
      - "Unidad 1: Fundamentos del sonido y medición": unidades/U-1-fundamentos-medicion/index.md
      - "Sesión 1: Introducción a la acústica aplicada a la producción musical": unidades/U-1-fundamentos-medicion/sesion-01/index.md
      - "Sesión 2: Naturaleza física del sonido": unidades/U-1-fundamentos-medicion/sesion-02/index.md
      - "Sesión 3: Velocidad de propagación del sonido": unidades/U-1-fundamentos-medicion/sesion-03/index.md
      - "Sesión 4: Señales periódicas y aperiódicas": unidades/U-1-fundamentos-medicion/sesion-04/index.md
      - "Sesión 5: Introducción a los logaritmos": unidades/U-1-fundamentos-medicion/sesion-05/index.md
      - "Sesión 6: Nivel de presión sonora": unidades/U-1-fundamentos-medicion/sesion-06/index.md
      - "Sesión 7: Suma y resta de niveles sonoros": unidades/U-1-fundamentos-medicion/sesion-07/index.md
      - "Sesión 8: Tipos de fuentes sonoras": unidades/U-1-fundamentos-medicion/sesion-08/index.md
