site_name: "Acústica Aplicada a la Producción Musical"
site_description: "Material de clase — Acústica Aplicada a la Producción Musical"
site_author: "José Urgilés"
repo_url: https://github.com/joseurgilesc/Ac-stica2026
repo_name: joseurgilesc/Ac-stica2026

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.arithmatex
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      lang: es

nav:
  - Inicio: index.md
  - Objetivos: objetivos.md
  - Logros de Aprendizaje: logros.md
  - Calendario: calendario.md
  - Bibliografía: bibliografia.md
  - Sesiones:
      - "Sesión 1": sesiones/sesion-01.md
      - "Sesión 2": sesiones/sesion-02.md
