<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿A dónde va la energía? — Absorción, transmisión y reflexión</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f0; font-family: system-ui, sans-serif; color: #172033; }
    #app { max-width: 920px; margin: 0 auto; padding: 16px; }
    h2 { margin-bottom: 4px; }
    p.lead { color: #526079; margin-top: 0; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 8px 0; }
    .row label { min-width: 130px; font-weight: 600; }
    .stat { padding: 10px 12px; background: #eef3ff; border-radius: 10px; min-width: 100px; flex: 1; text-align: center; }
    .stat .lbl { font-size: 11px; color: #526079; margin-bottom: 3px; }
    .stat .val { font-weight: 700; font-size: 15px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin: 12px 0; }
    button { padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; border: 1px solid #aab5c8; background: #fff; margin-right: 6px; }
    button.active { background: #249D8F; color: #fff; border-color: #249D8F; }
    canvas { display: block; margin: 14px 0; border: 1px solid #d8deea; border-radius: 12px; }
    .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; margin: 8px 0; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>
<div id="app">
  <h2>¿A dónde va la energía?</h2>
  <p class="lead">100 partículas = 100 % de la energía sonora que incide en una superficie. La energía se conserva: α + τ + ρ = 1.</p>

  <div class="row">
    <label>Absorción α:</label>
    <input type="range" id="alpha" min="0" max="1" value="0.3" step="0.01" style="flex:1 1 200px">
    <span id="alphaVal" style="font-weight:700">0.30</span>
  </div>

  <div class="row">
    <label>Transmisión τ:</label>
    <input type="range" id="tau" min="0" max="1" value="0.1" step="0.01" style="flex:1 1 200px">
    <span id="tauVal" style="font-weight:700">0.10</span>
  </div>

  <div class="row">
    <label>Rugosidad:</label>
    <input type="range" id="rough" min="0" max="100" value="20" step="1" style="flex:1 1 200px">
    <span id="roughVal" style="font-weight:700">20 %</span>
  </div>

  <div class="row">
    <label>Materiales:</label>
    <button id="btnConcreto">Concreto</button>
    <button id="btnCortina">Cortina pesada</button>
    <button id="btnEspuma">Espuma acústica</button>
    <button id="btnLanzar">▶ Lanzar onda</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="lbl">α (absorción)</div><div class="val" id="sAlpha">0.30</div></div>
    <div class="stat"><div class="lbl">τ (transmisión)</div><div class="val" id="sTau">0.10</div></div>
    <div class="stat"><div class="lbl">ρ (reflexión)</div><div class="val" id="sRho">0.60</div></div>
    <div class="stat"><div class="lbl">Suma α+τ+ρ</div><div class="val" id="sSum">1.00</div></div>
  </div>

  <div class="legend">
    <span><span class="dot" style="background:#C0392B"></span> Reflejada (especular)</span>
    <span><span class="dot" style="background:#27AE60"></span> Reflejada (difusa)</span>
    <span><span class="dot" style="background:#2471A3"></span> Absorbida</span>
    <span><span class="dot" style="background:#F1C40F"></span> Transmitida</span>
  </div>
</div>

<script>
let particles = [];
let wallX;
let alphaSlider, tauSlider, roughSlider;
let fired = false;

const RED = [192, 57, 43];     // specular reflection
const GREEN = [39, 174, 96];   // diffuse reflection
const BLUE = [36, 113, 163];   // absorbed
const YELLOW = [241, 196, 15]; // transmitted

function setup() {
  const cw = min(900, windowWidth - 40);
  const cnv = createCanvas(cw, 360);
  cnv.parent('app');
  cnv.style('display', 'block');
  cnv.style('margin', '14px 0');
  cnv.style('border', '1px solid #d8deea');
  cnv.style('border-radius', '12px');

  wallX = width * 0.6;

  alphaSlider = select('#alpha');
  tauSlider = select('#tau');
  roughSlider = select('#rough');

  alphaSlider.input(() => { select('#alphaVal').html(Number(alphaSlider.value()).toFixed(2)); updateStats(); });
  tauSlider.input(() => { select('#tauVal').html(Number(tauSlider.value()).toFixed(2)); updateStats(); });
  roughSlider.input(() => select('#roughVal').html(roughSlider.value() + ' %'));

  select('#btnConcreto').mousePressed(() => setMaterial(0.02, 0.01));
  select('#btnCortina').mousePressed(() => setMaterial(0.55, 0.15));
  select('#btnEspuma').mousePressed(() => setMaterial(0.85, 0.02));
  select('#btnLanzar').mousePressed(() => fire());

  textFont('system-ui');
  fire();
}

function setMaterial(a, t) {
  alphaSlider.value(a);
  tauSlider.value(t);
  select('#alphaVal').html(a.toFixed(2));
  select('#tauVal').html(t.toFixed(2));
  updateStats();
}

function updateStats() {
  const a = Number(alphaSlider.value());
  const t = Number(tauSlider.value());
  const r = Math.max(0, 1 - a - t);
  select('#sAlpha').html(a.toFixed(2));
  select('#sTau').html(t.toFixed(2));
  select('#sRho').html(r.toFixed(2));
  select('#sSum').html((a + t + r).toFixed(2));
}

function fire() {
  const a = Number(alphaSlider.value());
  const t = Number(tauSlider.value());
  const r = Math.max(0, 1 - a - t);
  const roughness = Number(roughSlider.value()) / 100;

  particles = [];
  for (let i = 0; i < 100; i++) {
    let fate;
    if (i < Math.round(a * 100)) fate = 'absorb';
    else if (i < Math.round((a + t) * 100)) fate = 'transmit';
    else fate = 'reflect';

    // Shuffle the order a bit for visual realism
    particles.push({
      x: 40,
      y: map(i, 0, 99, 40, height - 60),
      vx: 2.5,
      vy: 0,
      fate: fate,
      // For reflected: decide specular vs diffuse based on roughness
      diffuse: fate === 'reflect' && random() < roughness,
      stopped: false,
    });
  }
  // shuffle particles
  particles.sort(() => random() - 0.5);
  for (let i = 0; i < 100; i++) particles[i].y = map(i, 0, 99, 40, height - 60);
  fired = true;
}

function draw() {
  background(255);

  // Wall
  fill(60, 70, 85);
  noStroke();
  rect(wallX - 8, 20, 16, height - 40, 3);
  fill(23, 32, 51);
  textAlign(CENTER, TOP);
  textSize(11);
  text('Superficie', wallX, height - 14);

  // Move particles
  for (let p of particles) {
    if (p.stopped) continue;

    if (p.fate === 'absorb') {
      // Move toward wall, stop at wall
      if (p.x < wallX - 8) p.x += p.vx;
      else p.stopped = true;
    } else if (p.fate === 'transmit') {
      // Pass through wall
      if (p.x < wallX + 8) p.x += p.vx;
      else if (p.x < width - 20) p.x += p.vx;
    } else {
      // Reflect: bounce back
      if (p.x < wallX - 8) {
        p.x += p.vx;
      } else {
        // Bounce back
        if (p.diffuse) {
          p.vy = random(-1.5, 1.5);
          p.vx = -2.2;
        } else {
          p.vy = 0;
          p.vx = -2.5;
        }
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 20) p.stopped = true;
      }
    }
    // Bounce off top/bottom
    if (p.y < 25) { p.y = 25; p.vy = abs(p.vy); }
    if (p.y > height - 25) { p.y = height - 25; p.vy = -abs(p.vy); }
  }

  // Draw particles
  noStroke();
  for (let p of particles) {
    let col;
    if (p.fate === 'absorb') col = BLUE;
    else if (p.fate === 'transmit') col = YELLOW;
    else col = p.diffuse ? GREEN : RED;

    fill(col[0], col[1], col[2], p.stopped ? 130 : 230);
    circle(p.x, p.y, 9);
  }

  // Counts
  let absorbed = 0, transmitted = 0, reflected = 0, diffuse = 0;
  for (let p of particles) {
    if (p.fate === 'absorb') absorbed++;
    else if (p.fate === 'transmit') transmitted++;
    else { reflected++; if (p.diffuse) diffuse++; }
  }

  // Title
  noStroke();
  fill(23, 32, 51);
  textAlign(CENTER, TOP);
  textSize(13);
  textStyle(BOLD);
  text(
    'Absorbidas: ' + absorbed + '  |  Transmitidas: ' + transmitted +
    '  |  Reflejadas: ' + reflected + ' (' + diffuse + ' difusas)',
    width / 2, 10
  );
  textStyle(NORMAL);
}

function windowResized() {
  const cw = min(900, windowWidth - 40);
  resizeCanvas(cw, 360);
  wallX = width * 0.6;
}
</script>
</body>
</html>
