<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resonador de Helmholtz</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f0; font-family: system-ui, sans-serif; color: #172033; }
    #app { max-width: 920px; margin: 0 auto; padding: 16px; }
    h2 { margin-bottom: 4px; }
    p.lead { color: #526079; margin-top: 0; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 8px 0; }
    .row label { min-width: 130px; font-weight: 600; }
    .stat { padding: 10px 12px; background: #eef3ff; border-radius: 10px; min-width: 100px; flex: 1; text-align: center; }
    .stat .lbl { font-size: 11px; color: #526079; margin-bottom: 3px; }
    .stat .val { font-weight: 700; font-size: 15px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin: 12px 0; }
    select { padding: 6px 10px; border: 1px solid #aab5c8; border-radius: 6px; font-size: 13px; font-family: inherit; }
    canvas { display: block; margin: 14px 0; border: 1px solid #d8deea; border-radius: 12px; }
    .warn { color: #C0392B; font-weight: 700; font-size: 13px; }
  </style>
</head>
<body>
<div id="app">
  <h2>Resonador de Helmholtz</h2>
  <p class="lead">Masa de aire en el cuello + elasticidad del aire en la cavidad. f₀ = (c/2π)·√(S/(V·L_ef)).</p>

  <div class="row">
    <label>Volumen cavidad V:</label>
    <input type="range" id="vol" min="0.005" max="0.2" value="0.05" step="0.001" style="flex:1 1 200px">
    <span id="volVal" style="font-weight:700">50 L</span>
  </div>

  <div class="row">
    <label>Radio del cuello r:</label>
    <input type="range" id="radius" min="0.01" max="0.1" value="0.02" step="0.001" style="flex:1 1 200px">
    <span id="radiusVal" style="font-weight:700">20 mm</span>
  </div>

  <div class="row">
    <label>Longitud física L:</label>
    <input type="range" id="length" min="0.01" max="0.3" value="0.05" step="0.001" style="flex:1 1 200px">
    <span id="lengthVal" style="font-weight:700">50 mm</span>
  </div>

  <div class="row">
    <label>Corrección de terminación:</label>
    <select id="corrSel" style="min-width:160px">
      <option value="1.7" selected>Sin brida (1.7r)</option>
      <option value="0.85">Con brida (0.85r)</option>
      <option value="0">Sin corrección (0)</option>
    </select>
  </div>

  <div class="stats">
    <div class="stat"><div class="lbl">Área S</div><div class="val" id="sS">—</div></div>
    <div class="stat"><div class="lbl">L_ef</div><div class="val" id="sLef">—</div></div>
    <div class="stat"><div class="lbl">Frecuencia f₀</div><div class="val" id="sF0">—</div></div>
  </div>

  <p id="warnMsg" class="warn"></p>
</div>

<script>
const TEAL = [36, 157, 143];
const CORAL = [224, 90, 71];

function setup() {
  const cw = min(900, windowWidth - 40);
  const cnv = createCanvas(cw, 380);
  cnv.parent('app');
  cnv.style('display', 'block');
  cnv.style('margin', '14px 0');
  cnv.style('border', '1px solid #d8deea');
  cnv.style('border-radius', '12px');

  select('#vol').input(() => select('#volVal').html((Number(select('#vol').value()) * 1000).toFixed(0) + ' L'));
  select('#radius').input(() => select('#radiusVal').html((Number(select('#radius').value()) * 1000).toFixed(0) + ' mm'));
  select('#length').input(() => select('#lengthVal').html((Number(select('#length').value()) * 1000).toFixed(0) + ' mm'));

  textFont('system-ui');
}

function draw() {
  background(255);

  const V = Number(select('#vol').value());
  const r = Number(select('#radius').value());
  const L = Number(select('#length').value());
  const corrFactor = Number(select('#corrSel').value());
  const c = 343;

  const S = PI * r * r;
  const Lef = L + corrFactor * r;

  let f0;
  let warning = '';
  if (Lef <= 0) {
    f0 = Infinity;
    warning = '⚠️ Longitud efectiva no válida (L_ef ≤ 0). Ajusta el radio o la longitud.';
  } else {
    f0 = (c / (2 * PI)) * Math.sqrt(S / (V * Lef));
  }

  select('#sS').html((S * 10000).toFixed(1) + ' cm²');
  select('#sLef').html((Lef * 1000).toFixed(1) + ' mm');
  select('#sF0').html(isFinite(f0) ? f0.toFixed(1) + ' Hz' : '—');
  select('#warnMsg').html(warning);

  // ── Resonator drawing ──
  const cx = width * 0.35;
  const cy = height * 0.55;

  // Cavity (bottle body) — size scales with volume
  const bodyW = map(V, 0.005, 0.2, 60, 180);
  const bodyH = map(V, 0.005, 0.2, 80, 200);

  // Neck (scales with radius and length)
  const neckW = map(r, 0.01, 0.1, 10, 40);
  const neckH = map(L, 0.01, 0.3, 20, 100);

  // Neck (vertical tube)
  fill(80, 90, 110);
  noStroke();
  rect(cx - neckW / 2, cy - bodyH / 2 - neckH, neckW, neckH, 3);

  // Cavity (bottle body)
  fill(200, 210, 225);
  stroke(120);
  strokeWeight(1.5);
  rect(cx - bodyW / 2, cy - bodyH / 2, bodyW, bodyH, 12);
  noStroke();

  // Labels
  fill(23, 32, 51);
  textAlign(CENTER, TOP);
  textSize(11);
  textStyle(BOLD);
  text('Cuello (masa de aire)', cx, cy - bodyH / 2 - neckH - 22);
  text('Cavidad (elasticidad del aire)', cx, cy + bodyH / 2 + 8);
  textStyle(NORMAL);
  fill(90);
  textSize(10);
  text('r = ' + (r * 1000).toFixed(0) + ' mm, L = ' + (L * 1000).toFixed(0) + ' mm', cx, cy - bodyH / 2 - neckH - 6);
  text('V = ' + (V * 1000).toFixed(0) + ' L', cx, cy + bodyH / 2 + 22);

  // ── Mass-spring analogy ──
  const mx = width * 0.72;
  const my = cy;

  // Spring (zigzag)
  stroke(TEAL[0], TEAL[1], TEAL[2]);
  strokeWeight(2);
  noFill();
  beginShape();
  for (let i = 0; i <= 10; i++) {
    let yy = my - 60 + (i / 10) * 50;
    let xx = mx + (i % 2 === 0 ? -8 : 8);
    vertex(xx, yy);
  }
  endShape();

  // Mass (square)
  fill(CORAL[0], CORAL[1], CORAL[2]);
  noStroke();
  rect(mx - 15, my + 5, 30, 30, 4);
  fill(255);
  textAlign(CENTER, CENTER);
  textSize(10);
  text('masa', mx, my + 20);

  fill(23, 32, 51);
  textAlign(CENTER, TOP);
  textSize(11);
  text('Analogía masa-resorte', mx, my - 90);

  // ── Response curve ──
  const gx = width * 0.15;
  const gy = height * 0.75;
  const gw = width * 0.75;
  const gh = 60;

  noStroke();
  fill(248, 250, 255);
  rect(gx - 5, gy - 20, gw + 10, gh + 30, 6);

  // Log frequency axis from f0/4 to f0*4
  const fmin = isFinite(f0) ? f0 / 4 : 20;
  const fmax = isFinite(f0) ? f0 * 4 : 200;

  // Response: resonant peak at f0 (Lorentzian-like)
  if (isFinite(f0)) {
    stroke(TEAL[0], TEAL[1], TEAL[2]);
    strokeWeight(2.5);
    noFill();
    beginShape();
    for (let i = 0; i <= 200; i++) {
      let f = fmin * Math.pow(fmax / fmin, i / 200);
      let x = map(Math.log10(f), Math.log10(fmin), Math.log10(fmax), gx, gx + gw);
      // Simple resonance curve (relative absorption, qualitative)
      let Q = 8;
      let resp = 1 / (1 + Q * Math.pow((f / f0 - f0 / f), 2));
      let y = gy + gh - resp * gh;
      vertex(x, y);
    }
    endShape();

    // Peak marker
    let fx = map(Math.log10(f0), Math.log10(fmin), Math.log10(fmax), gx, gx + gw);
    fill(CORAL[0], CORAL[1], CORAL[2]);
    noStroke();
    circle(fx, gy, 7);
    textAlign(CENTER, BOTTOM);
    textSize(9);
    text('f₀ = ' + f0.toFixed(1) + ' Hz', fx, gy - 4);
  }

  fill(90);
  textAlign(CENTER, TOP);
  textSize(10);
  text('Respuesta cualitativa (curva de resonancia)', gx + gw / 2, gy - 18);
}

function windowResized() {
  const cw = min(900, windowWidth - 40);
  resizeCanvas(cw, 380);
}
</script>
</body>
</html>
