<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parametros de una onda sinusoidal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #f5f5f0; font-family: Georgia, serif; }
    canvas { display: block; }
    #panel {
      position: absolute; top: 0; left: 0; width: 210px; height: 100vh;
      background: rgba(36, 157, 143, 0.04); color: #1a1a1a; padding: 12px;
      font-size: 11px; z-index: 5; overflow-y: auto;
      border-right: 1px solid rgba(36, 157, 143, 0.15);
    }
    #panel h3 { margin: 0 0 6px; font-size: 13px; color: #1A7A6F; }
    #panel label { display: block; margin: 6px 0 2px; color: #333; font-size: 10px; }
    #panel input[type=range] { width: 100%; accent-color: #249D8F; margin: 3px 0; }
    #panel input[type=number] { width: 55px; padding: 2px; border: 1px solid #ccc; border-radius: 3px; font-size: 11px; }
    #panel button { width: 100%; margin: 3px 0; padding: 5px 8px; border: 1px solid rgba(36,157,143,0.3); border-radius: 3px; cursor: pointer; background: rgba(36,157,143,0.05); font-size: 11px; font-family: Georgia, serif; }
    #panel button:hover { background: rgba(36,157,143,0.12); }
    #panel .section { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(36,157,143,0.12); }
    #panel .info { padding: 6px 8px; margin: 4px 0; background: rgba(36,157,143,0.06); border-radius: 4px; font-size: 10px; }
  </style>
</head>
<body>

<div id="panel">
  <h3>y(t) = A sin(2pi f t + phi)</h3>
  <div class="section">
    <label>A (m): <input type="number" id="ampN" value="20" min="5" max="60" step="1"></label>
    <input type="range" id="amp" min="5" max="60" value="20" step="1">
  </div>
  <div class="section">
    <label>f (Hz): <input type="number" id="freqN" value="1" min="0.3" max="5" step="0.1"></label>
    <input type="range" id="freq" min="0.3" max="5" value="1" step="0.1">
  </div>
  <div class="section">
    <label>phi (deg): <input type="number" id="phaseN" value="0" min="0" max="360" step="5"></label>
    <input type="range" id="phase" min="0" max="360" value="0" step="5">
  </div>
  <div class="section">
    <button id="btn-pause">Pausar</button>
    <button id="btn-reset">Valores iniciales</button>
  </div>
  <div class="section">
    <div class="info">T = 1/f = <b id="tv">1.000 s</b></div>
    <div class="info">lambda = v/f = <b id="lv">344.0 m</b>  (v = 344 m/s)</div>
  </div>
</div>

<script>
let amp = 20, freq = 1, phaseDeg = 0;
let t = 0, paused = false;
const V = 344;
const GX = 230;

function setup() {
  createCanvas(windowWidth, windowHeight);
  textFont('Georgia');

  let aS = select('#amp'), aN = select('#ampN');
  let fS = select('#freq'), fN = select('#freqN');
  let pS = select('#phase'), pN = select('#phaseN');

  function sync() {
    aS.elt.value = aN.elt.value = amp;
    fS.elt.value = fN.elt.value = freq;
    pS.elt.value = pN.elt.value = phaseDeg;
    select('#tv').html((1/freq).toFixed(3) + ' s');
    select('#lv').html((V/freq).toFixed(1) + ' m');
  }

  aS.input(() => { amp = +aS.value(); sync(); });
  aN.input(() => { amp = constrain(+aN.value()||20, 5, 60); sync(); });
  fS.input(() => { freq = +fS.value(); sync(); });
  fN.input(() => { freq = constrain(+fN.value()||1, 0.3, 5); sync(); });
  pS.input(() => { phaseDeg = +pS.value(); sync(); });
  pN.input(() => { phaseDeg = constrain(+pN.value()||0, 0, 360); sync(); });

  select('#btn-reset').mousePressed(() => {
    amp = 20; freq = 1; phaseDeg = 0; t = 0; sync();
  });
  select('#btn-pause').mousePressed(() => {
    paused = !paused;
    select('#btn-pause').html(paused ? 'Reanudar' : 'Pausar');
  });

  sync();
}

function draw() {
  background(245, 245, 240);
  if (!paused) t += deltaTime * 0.001;

  let GW = width - GX - 30;
  let CY = height * 0.5;
  let maxAmp = map(amp, 5, 60, 25, 200);
  let ph = phaseDeg * PI / 180;

  // --- Center line ---
  stroke(36, 157, 143, 60);
  strokeWeight(1.5);
  line(GX, CY, GX + GW, CY);
  noStroke();

  // --- Amplitude zone ---
  stroke(36, 157, 143, 30);
  strokeWeight(1);
  line(GX, CY - maxAmp, GX + GW, CY - maxAmp);
  line(GX, CY + maxAmp, GX + GW, CY + maxAmp);
  noStroke();
  fill(26, 122, 111, 100);
  textSize(10);
  textAlign(RIGHT, CENTER);
  text('A='+amp+'m', GX-10, CY-maxAmp/2);
  text('0', GX-10, CY);

  // --- Wave: y = A * sin(2*pi*freq * u - omega*t + phi) ---
  // At u=0 (left edge), t=0, phi=0: sin(0)=0 ✓
  stroke(36, 157, 143);
  strokeWeight(3);
  noFill();
  beginShape();
  for (let i = 0; i <= 400; i++) {
    let x = GX + (i/400) * GW;
    let u = (i/400);  // 0..1
    let val = sin(TWO_PI * freq * u - t * 2 + ph);
    vertex(x, CY - val * maxAmp);
  }
  endShape();

  // --- Start dot ---
  let startVal = sin(0 - t*2 + ph);
  fill(36, 157, 143);
  noStroke();
  circle(GX, CY - startVal * maxAmp, 7);

  // --- Wavelength ---
  let lamPx = GW / freq;
  if (lamPx < GW*0.85 && lamPx > 50) {
    let lx = GX + 5, ly = CY + maxAmp + 35;
    stroke(255,180,40,150); strokeWeight(2);
    line(lx, ly, lx+lamPx, ly);
    line(lx, ly-7, lx, ly+7);
    line(lx+lamPx, ly-7, lx+lamPx, ly+7);
    noStroke(); fill(255,180,40);
    textSize(12); textAlign(CENTER, TOP);
    text('lambda = '+(V/freq).toFixed(1)+' m', lx+lamPx/2, ly+8);
  }

  // --- Period ---
  if (lamPx < GW*0.85) {
    let px = GX+5, py = CY-maxAmp-38;
    stroke(100,160,255,150); strokeWeight(2);
    line(px, py, px+lamPx, py);
    line(px, py-7, px, py+7);
    line(px+lamPx, py-7, px+lamPx, py+7);
    noStroke(); fill(100,160,255);
    textSize(11); textAlign(CENTER, BOTTOM);
    text('T = '+(1/freq).toFixed(3)+' s', px+lamPx/2, py-8);
  }

  // --- Title ---
  fill(26,122,111); textSize(14);
  textAlign(CENTER, TOP);
  text('y(t) = '+amp+' sin(2pi '+freq.toFixed(1)+' t + '+phaseDeg+'deg)', GX+GW/2, 18);
  fill(120); textSize(10);
  text('T='+(1/freq).toFixed(2)+'s | lambda='+(V/freq).toFixed(1)+'m | v='+V+' m/s', GX+GW/2, 38);

  // Legend
  textAlign(LEFT, TOP); textSize(10);
  fill(255,180,40); text('lambda', width-200, 70);
  fill(100,160,255); text('T', width-200, 82);
  fill(224,90,71); text('phi', width-200, 94);

  if (paused) { fill(224,90,71); textSize(13); textAlign(RIGHT, TOP); text('PAUSADO', GX+GW, 18); }
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>
</body>
</html>
